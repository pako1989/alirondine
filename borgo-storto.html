<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Borgo Storto · Ali di Rondine</title>
<style>
:root{--bg:#0e1424;--card:#172038;--line:#2c3a5e;--ink:#f1f4ff;--dim:#9aa8cf;--gold:#ffd23f;--red:#ff5d6c;--grn:#57d68d;--blu:#6fb3ff}
body.theme-vintage{--bg:#191410;--card:#292019;--line:#473729;--ink:#f8f2e6;--dim:#baa48b;--gold:#e5a73b;--red:#cf3742;--grn:#52aa66;--blu:#4088d6}
body.theme-neon{--bg:#050b18;--card:#0d172e;--line:#00e5ff55;--ink:#f0faff;--dim:#7f9ec2;--gold:#ffd000;--red:#ff2d62;--grn:#00e676;--blu:#00e5ff}
body.theme-arcade{--bg:#0a1b0a;--card:#133313;--line:#2a572a;--ink:#d2f694;--dim:#7da54b;--gold:#e2c034;--red:#e04838;--grn:#5da832;--blu:#42b0d5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px 40px;transition:background .2s,color .2s}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn-icon{background:#1e2d57;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:4px 10px;font-size:15px;cursor:pointer}
.float-num{position:absolute;pointer-events:none;font-weight:bold;font-size:22px;text-shadow:1px 1px 4px #000;animation:floatUp .8s ease forwards;z-index:20}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-28px) scale(1.2)}}
.screen-flash{animation:flashHit .22s ease}
@keyframes flashHit{0%,100%{filter:none}50%{filter:brightness(1.6) contrast(1.3)}}
#app{max-width:620px;margin:0 auto;padding-top:8px}
h1{font-size:22px;margin:4px 0 2px;color:var(--gold)}
.sub{color:var(--dim);font-size:14px;margin-bottom:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.who{display:inline-block;background:#43507a;border-radius:8px;padding:2px 10px;font-size:14px;margin-bottom:6px;font-weight:bold}
[hidden]{display:none!important}
button{display:block;width:100%;text-align:left;background:#1e2d57;color:var(--ink);border:2px solid #3b4f86;border-radius:12px;padding:11px 14px;margin:8px 0;font:inherit;cursor:pointer;transition:transform .1s,background .15s}
button:active{transform:scale(.98)}
button small{display:block;color:var(--dim);font-size:12px}
button.hot{background:#2a3f7a;border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
.bar{height:10px;border-radius:6px;background:#0a0f1d;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;background:var(--grn);transition:width .3s}
.bar.e i{background:var(--red)}
.row{display:flex;gap:8px}.row>div{flex:1}
.unit{font-size:13px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:4px}.unit b{font-size:14px}
.dead{opacity:.35;filter:grayscale(1)}
.log{font-size:14px;color:#d7defa;min-height:3em;line-height:1.4}
.stun::after{content:" 💫"}
canvas#cv{width:100%;image-rendering:pixelated;border:2px solid var(--line);border-radius:12px;display:block;background:#050b14;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:10px auto}
.pad button{margin:0;text-align:center;font-size:22px;padding:14px 0;touch-action:manipulation}
.dlg{display:flex;gap:12px;align-items:flex-start}.dlg img{width:64px;height:64px;image-rendering:pixelated;border:2px solid var(--line);border-radius:10px;background:#0a0f1d;flex:none}
.ui{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle;margin-right:6px}
.guard-banner{background:rgba(245,158,11,0.2);border:1px solid #f59e0b;color:#fcd34d;padding:6px 10px;border-radius:8px;font-size:12px;text-align:center;margin:6px 0;font-weight:bold}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";
const K = "ali-di-rondine.borgostorto";
const $ = (s) => document.querySelector(s), app = $("#app");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const load = () => { try { const v = JSON.parse(localStorage.getItem(K)); return v && v.v === 1 ? v : null; } catch { return null; } };
const save = () => { try { localStorage.setItem(K, JSON.stringify(G)); } catch {} };
let G = load() || { v: 1, done: [], party: ["leo", "gigi", "sara"], lv: 1, focacce: 3, cap: 1, area: 0, flags: {} };

const THEMES = [
  { id: "classic", name: "Classico", cls: "", icon: "⚽" },
  { id: "vintage", name: "Vintage", cls: "theme-vintage", icon: "📰" },
  { id: "neon", name: "Neon", cls: "theme-neon", icon: "✨" },
  { id: "arcade", name: "Arcade", cls: "theme-arcade", icon: "🕹️" }
];
let curThemeIdx = 0;
function applyTheme(idx) {
  curThemeIdx = (idx + THEMES.length) % THEMES.length;
  const th = THEMES[curThemeIdx];
  document.body.classList.remove("theme-vintage", "theme-neon", "theme-arcade");
  if (th.cls) document.body.classList.add(th.cls);
  try { localStorage.setItem("ali-di-rondine.theme", th.id); } catch (e) {}
}
function cycleTheme() {
  applyTheme(curThemeIdx + 1);
  const btn = $("#thBtn");
  if (btn) btn.textContent = "🎨 " + THEMES[curThemeIdx].name;
}
try {
  const savedTh = localStorage.getItem("ali-di-rondine.theme") || "classic";
  const fIdx = THEMES.findIndex(t => t.id === savedTh);
  applyTheme(fIdx >= 0 ? fIdx : 0);
} catch (e) {}

// ---- EROI & MOSSE SPECIALI ----
const HERO = {
  leo: {
    name: "Leo", ic: "⚽", hp: 75, sk: [
      { n: "Tiro Teso", d: "danno 12-18", c: 0, f: (u, t) => hit(t, Math.round((rnd(12, 18) + G.lv * 2) * (u.pw ? 1.3 : 1)), `${u.name} calcia secco e preciso contro ${t.name}.`) },
      { n: "Tiro della Rondine", d: "danno 32-42 · grinta 3", c: 3, f: (u, t) => hit(t, Math.round((rnd(32, 42) + G.lv * 3) * (u.pw ? 1.35 : 1)), `🕊️ TIRO DELLA RONDINE! Una traiettoria arcuata che buca la difesa di ${t.name}!`) },
      { n: "🔥 Doppia Rondine dei Fratelli", d: "danno 65-80 · combo letale con Dario · grinta 4", c: 4, combo: "dario", f: (u, t) => hit(t, Math.round((rnd(65, 80) + G.lv * 4) * (u.pw ? 1.4 : 1)), `⚡🔥 DOPPIA RONDINE DEI FRATELLI MORETTI! Leo crossa a effetto e Dario stacca a mezz'aria in rovesciata d'ossidiana!`) }
    ]
  },
  gigi: {
    name: "Gigi", ic: "🕊️", hp: 60, sk: [
      { n: "Chiacchiera Estenuante", d: "danno 8-12, abbassa l'attacco nemico", c: 0, f: (u, t) => { t.weak = 2; floatText("ATTACCO GIÙ!", "#6fb3ff"); return hit(t, rnd(8, 12) + G.lv, `Gigi parla a raffica del meteo del '74: ${t.name} perde la concentrazione.`); } },
      { n: "KRAAA!", d: "stordisce un nemico per un turno · grinta 2", c: 2, f: (u, t) => { t.stun = 1; floatText("STUN!", "#ffd23f"); return `${u.name} imita un gabbiano così forte che ${t.name} rimane intontito!`; } },
      { n: "Gabbiano Sonico", d: "danno 22-30 · stordisce e rompe scudi · grinta 3", c: 3, f: (u, t) => { t.stun = 1; t.shield = 0; floatText("SONICO!", "#ffd23f"); return hit(t, rnd(22, 30) + G.lv * 2, `⚡ GABBIANO SONICO! L'onda d'urto manda in tilt ${t.name}!`); } }
    ]
  },
  sara: {
    name: "Sara", ic: "📓", hp: 60, sk: [
      { n: "Appunti Tattici", d: "danno 10-15", c: 0, f: (u, t) => hit(t, rnd(10, 15) + G.lv * 2, `Sara individua il punto debole di ${t.name} e lo colpisce sul tempo.`) },
      { n: "Analisi Vulnerabilità", d: "il nemico subisce +50% danno per 2 turni · grinta 2", c: 2, f: (u, t) => { t.mark = 2; floatText("MARCATO!", "#3fa7ff"); return `«Punto debole individuato.» ${t.name} ora è vulnerabile a tutti i colpi!`; } },
      { n: "Aura Tattica Anime", d: "potenzia tutta la squadra per 2 turni · grinta 3", c: 3, self: 1, f: (u) => { P.u.forEach(x => { if (x.hp > 0) x.pw = 2; }); floatText("AURA SQUADRA!", "#57d68d"); return `✨ AURA TATTICA! Tutta la squadra entra in stato di concentrazione assoluta (+35% danno)!`; } }
    ]
  },
  nico: {
    name: "Nico", ic: "🧤", hp: 85, sk: [
      { n: "Presa Sicura", d: "cura sé stesso di 28", c: 0, self: 1, f: (u) => { u.hp = Math.min(u.max, u.hp + 28); floatText("+28", "#57d68d"); return `Nico blocca il tiro in presa alta e riprende fiato.`; } },
      { n: "Gatto Volante", d: "scudo per tutta la squadra per un turno · grinta 2", c: 2, self: 1, f: (u) => { P.guard = 1; floatText("DIFESA TOTALE!", "#3fa7ff"); return `🐱 GATTO VOLANTE! Nico si tuffa a corpo morto proteggendo tutti i compagni!`; } },
      { n: "Uscita Bassa d'Acciaio", d: "danno 24-34 · disarma il nemico · grinta 3", c: 3, f: (u, t) => { t.weak = 2; return hit(t, rnd(24, 34) + G.lv * 2, `Nico esce sui piedi di ${t.name} con un tempismo perfetto!`); } }
    ]
  },
  rita: {
    name: "Rita", ic: "🍳", hp: 70, sk: [
      { n: "Padellata Pesante", d: "danno 16-24 · stordisce sotto 50% HP", c: 0, f: (u, t) => { const s = t.hp < t.max * 0.5 ? (t.stun = 1, " STORDITO!") : ""; if (s) floatText("STUN!", "#ffd23f"); return hit(t, rnd(16, 24) + G.lv * 2, `Rita cala la padella pesante di ghisa su ${t.name}!${s}`); } },
      { n: "Focaccia Calda al Volo", d: "cura 40 HP al compagno più ferito · grinta 2", c: 2, self: 1, f: (u) => { const w = P.u.filter(x => x.hp > 0).sort((a,b)=>a.hp-b.hp)[0]; if (w) { w.hp = Math.min(w.max, w.hp + 40); floatText("+40", "#57d68d"); return `Rita lancia una teglia di focaccia fumante a ${w.name}: +40 HP!`; } return "Nessuno ferito."; } }
    ]
  },
  dario: {
    name: "Dario", ic: "🔥", hp: 80, sk: [
      { n: "Cannone d'Ossidiana", d: "danno 18-26", c: 0, f: (u, t) => hit(t, rnd(18, 26) + G.lv * 2, `Dario scarica un destro terrificante contro ${t.name}!`) },
      { n: "Spallata da Centravanti", d: "danno 28-38 · spezza difese · grinta 2", c: 2, f: (u, t) => { t.shield = 0; return hit(t, rnd(28, 38) + G.lv * 3, `Dario vince il duello fisico e spazza via la guardia di ${t.name}!`); } }
    ]
  }
};
const NAMES = { leo: "Leo", gigi: "Gigi", sara: "Sara", nico: "Nico", rita: "Rita", dario: "Dario" };

// ---- NEMICI BILANCIATI & SFIDANTI ----
const FOE = {
  gabb: () => ({ name: "Gabbiano Sindacalista", ic: "🐦", hp: 38, atk: [7, 12], strike: 1, say: ["«Pausa sindacale sul primo palo!»", "«Sciopero del gol!»"] }),
  cuoco: () => ({ name: "Pino Con Più Braccia", ic: "🍝", hp: 68, atk: [9, 15], say: ["«Otto frittelle e un contrasto secco!»", "«Il menu non prevede il pareggio!»"] }),
  tommy: () => ({ name: "Tommy Senza Difetti", ic: "😇", hp: 85, atk: [11, 16], shield: 1, say: ["«Non sbaglio mai un aggancio.»", "«La mia tecnica è impeccabile.»"] }),
  rugg: () => ({ name: "Ruggeri Troppo Gentile", ic: "🥰", hp: 250, atk: [13, 19], boss: 1, heal: 0, say: ["«Un abbraccio prima del cartellino!»", "«Siete tutti bravissimi, restate nel paradosso!»"] }),
  granchio: () => ({ name: "Granchio Guardalinee", ic: "🦀", hp: 55, atk: [9, 14], strike: 1, say: ["«Fuorigioco millimetrico sulle chele!»", "«Pizzico sui polpacci!»"] }),
  ombra: () => ({ name: "Ombra del Provino", ic: "👤", hp: 85, atk: [12, 18], strike: 1, say: ["«Quel rigore non lo segnerai mai.»", "«Il dubbio ti congela i muscoli.»"] }),
  padella: () => ({ name: "Padella Infuocata", ic: "🍳", hp: 95, atk: [11, 17], shield: 1, say: ["«Brucia sul fondo a fuoco vivo!»", "«Oggi niente focaccia per nessuno!»"] }),
  arbitro: () => ({ name: "L'Arbitro del Paradosso", ic: "⏱️", hp: 340, atk: [15, 23], boss: 1, heal: 0, say: ["«Fischio preventivo nello spazio-tempo!»", "«Recupero infinito fino al blackout!»"] })
};

// ---- STORIA DEI CAPITOLI ----
const T = (who, text) => ({ who, text });
const STORY = {
  intro: [
    T(null, "Sera sul campetto del Borgo. L'allenamento è finito. Ugolino Lampadina è sul tetto del campanile con due cavi e un flipper."),
    T("ugolino", "Ho collegato il campanile al flipper per fare una luminaria «dinamica». È andata benissimo. Fino a quando è andata malissimo."),
    T(null, "Nel cielo si apre una crepa verde, larga come una busta della spesa."),
    T("gigi", "Cazzo. Il cielo si è aperto come un sacchetto del pane."),
    T("sara", "Statisticamente è la cosa più improbabile mai successa al Borgo. E abbiamo un precedente col campanile."),
    T("leo", "Qualcuno guardi dentro. No, non io. Va bene, io."),
    T(null, "Entrate. Dall'altra parte c'è il Borgo. Ma qualcosa è storto: il campanile pende, le barche hanno le ruote, e tutti i gabbiani hanno un cartellino con il nome.")
  ],
  n1: [T("gigi", "Questo è il Borgo Storto. Lo capisco da come i gabbiani ci guardano male."), T(null, "Due gabbiani con la sciarpa del sindacato vi bloccano il passaggio.")],
  w1: [T("sara", "Appunto: dopo l'ultimo sciopero hanno chiesto anche i weekend. Andiamo."), T("gigi", "Mi hanno quasi convinto. Quasi.")],
  n2: [
    T(null, "La Trattoria Moretti è aperta. Dentro c'è un uomo con la maglia numero 9 incorniciata sul muro. È papà Moretti, ma qui è un'altra persona."),
    T("papa", "Ragazzi! Sono il 9 della nazionale da vent'anni. Firmo autografi sui piatti."),
    T("leo", "…Papà? Qui hai continuato a giocare?"),
    T("papa", "Sì. Ho tre scudetti, due Palloni d'oro e nessuno che mi prepara le acciughe."),
    T("leo", "E sei felice?"),
    T("papa", "…Sono famoso. È diverso."),
    T(null, "Leo non risponde. Dalla cucina esce Pino con otto braccia e vi guarda male.")
  ],
  w2: [T("leo", "Andiamo. Non voglio più sentire che qui «papà vince»."), T("sara", "Appunto. Non ti ha neanche chiesto come stai.")],
  n3: [
    T(null, "Al molo c'è una porta da calcio sul mare, e dentro c'è Nico che para da ore lo stesso identico tiro di Tommy."),
    T("tommy", "Ciao ragazzi. Non perdo mai, non sbaglio mai e non ho mai fame."),
    T("gigi", "Fa paura. Voglio il Tommy vero."),
    T("nico", "Aiuto! Sono in questa porta da un tempo infinito! Ho parato quattrocento volte lo stesso tiro!")
  ],
  w3: [T("nico", "Grazie ragazzi! Mi unisco a voi: nessuno segna contro la Rondine!"), T(null, "Nico si unisce alla squadra!")],
  n4: [
    T(null, "Il chiosco di Tonino. Sulla lavagna: «Gusto del giorno: Paradosso». Costa un euro e il futuro."),
    T("tonino", "Chi lo assaggia sta benissimo per un'ora. Poi inizia a ricordarsi cose mai successe.")
  ],
  n5: [
    T(null, "Il campanile storto. In cima, al posto del flipper, c'è il Mister. Sorride. Troppo."),
    T("rugg", "Ragazzi! Che bello vedervi! Qui nessuno si arrabbia mai. Nessuno corre. Nessuno perde. Rimanete."),
    T("sara", "È Ruggeri… gentile. È la cosa più inquietante che abbia mai visto."),
    T("leo", "Mister, il Ruggeri vero urlava, ma ci ha insegnato a stare in campo."),
    T("rugg", "Urlare non serve. Io vi voglio bene e basta.")
  ],
  mid: "«Ho detto che vi voglio bene. Avevo un'altra squadra, una volta. Qui non perderemo mai!»",
  win: [
    T("rugg", "…Va bene. Vi lascio andare. Ricordatemi urlare, ogni tanto."),
    T("ugolino", "Ragazzi! Ho trovato l'interruttore! Se lo giro la crepa si chiude. Se lo lascio così, rimane aperta di un dito.")
  ],
  // CAPITOLO 2 (Completamente rivisto con dialoghi vivi)
  intro2: [
    T(null, "Capitolo 2: L'Orologio del Paradosso. Le lancette del campanile girano vorticosamente all'indietro!"),
    T("ugolino", "Il flipper emette fiamme verdi e le lancette girano a 200 all'ora al contrario!"),
    T("leo", "La spiaggia è capovolta e l'acqua sembra vetro. Dobbiamo raggiungere la cima dell'Orologio!"),
    T("sara", "Attenzione: in questa dimensione temporale i ricordi si materializzano contro di noi."),
    T("gigi", "Io ho ancora una teglia di focaccia nello zaino. Andiamo!")
  ],
  n6: [
    T("gigi", "La Spiaggia Storta. Guardate quei granchi con i fischietti!"),
    T(null, "Due Granchi Guardalinee agitano chele e cartellini: «Fuorigioco preventivo sui sassi!»")
  ],
  w6: [
    T("sara", "Fuorigioco annullato. Continuiamo verso il promontorio."),
    T("leo", "Là in fondo c'è una figura familiare tra gli scogli...")
  ],
  n7: [
    T(null, "Il Faro Sommerso. L'acqua non bagna, ma è densa come mercurio. Un'ombra sbarra il cammino."),
    T("ombra", "Moretti... Io sono la paura di quando hai calciato quel rigore sulla traversa al 90°."),
    T("leo", "Quel rigore mi ha insegnato a rialzarmi. Adesso non ho più paura.")
  ],
  w7: [
    T("nico", "L'ombra si è dissolta! Ma sento profumo di fritto e legna bruciata..."),
    T("gigi", "È Rita! Riconoscerei quel soffritto anche in un'altra dimensione!")
  ],
  n8: [
    T(null, "La Trattoria del Tempo. Rita è assediata da padelle volanti incandescenti!"),
    T("rita", "Leo! Ragazzi! Queste padelle non capiscono che la focaccia va cotta a legna e non col fuoco quantico!"),
    T("leo", "Tranquilla Rita, spegniamo noi l'incendio!")
  ],
  w8: [
    T("rita", "Grazie ragazzi! Mi unisco a voi: con la mia padella pesante non passa nessuno!"),
    T(null, "Rita si unisce alla squadra!"),
    T("dario", "Ehi! Credevate davvero di scalare la torre senza di me?"),
    T("leo", "Dario! Sei qui anche tu?"),
    T("dario", "Certo. Nessuno toglie il trofeo ai fratelli Moretti. Pronti per la mossa combinata?"),
    T(null, "Dario si unisce alla squadra! Sbloccata la mossa: 🔥 Doppia Rondine dei Fratelli!")
  ],
  n9: [
    T(null, "La Pineta Capovolta. Gli alberi affondano le radici nel cielo indaco. Tonino è lì con una cassa di Chinotto."),
    T("tonino", "Chinotto del Paradosso ghiacciato. Una bottiglietta e la vostra Grinta torna al massimo!")
  ],
  n10: [
    T(null, "L'Orologio del Campanile. In mezzo a ingranaggi dorati e lancette ciclopiche troneggia l'Arbitro."),
    T("arbitro", "Io sono l'Arbitro del Paradosso. Qui il novantesimo minuto non arriva mai! Sarete espulsi per sempre!"),
    T("leo", "Fischia l'inizio, arbitro. La Rondine gioca fino alla vittoria!")
  ],
  mid2: "«ESPULSIONE DIRETTA PER VIOLAZIONE DELLO SPAZIO-TEMPO! TEMPO FERMO!»",
  win2: [
    T("arbitro", "…Triplice fischio. Il tempo ha ripreso a scorrere. La crepa sul campanile si chiude."),
    T("ugolino", "Le lancette girano dritte! Abbiamo salvato il Borgo!"),
    T("dario", "Bella partita, fratellino. Andiamo a mangiare le acciughe di papà.")
  ]
};
const WHO = { rita: "Rita", ugolino: "Ugolino", papa: "Papà Moretti", tommy: "Tommy (perfetto)", tonino: "Tonino", rugg: "Mister Ruggeri", leo: "Leo", gigi: "Gigi", sara: "Sara", nico: "Nico", dario: "Dario", granchio: "Granchio", ombra: "Ombra", padella: "Padella", arbitro: "Arbitro" };

// ---- MAPPE DELLE TAPPE ----
const NODES = [
  { id: "n1", t: "Il campetto storto", sub: "Due gabbiani sindacalizzati", foes: ["gabb", "gabb"], cap: 1 },
  { id: "n2", t: "Trattoria Moretti", sub: "Papà è famoso", foes: ["cuoco"], cap: 1 },
  { id: "n3", t: "Il molo", sub: "Nico è chiuso in una porta", foes: ["tommy"], join: "nico", cap: 1 },

const SPR = {};
function sprite(id, px, frame) {
  frame = frame || 0;
  const key = id + "@" + px + "#" + frame;
  if (SPR[key]) return SPR[key];
  const W = 18, H = 22, base = document.createElement("canvas");
  base.width = W; base.height = H;
  const g = base.getContext("2d"), q = PAL[id] || PAL.leo;
  const r = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x + 1, y + 1, w, h); };

  if (q.crab) {
    r(3, 8, 12, 7, "#ff4d5a");
    r(1, 5, 4, 4, "#ff4d5a"); r(13, 5, 4, 4, "#ff4d5a");

    r(14, 2, 4, 3, "#ffd23f"); r(13, 1, 1, 6, "#111");
  } else if (q.pan) {
    r(3, 5, 12, 10, "#475569"); r(4, 6, 10, 8, "#f59e0b"); r(14, 9, 3, 2, "#1e293b");
    r(5, 8, 2, 2, "#ef4444"); r(9, 8, 2, 2, "#ef4444");
    r(6, 2 + (frame % 2), 2, 2, "#ffffff88");
  } else if (q.bird) {
    r(3, 8, 9, 6, "#f7f7f7"); r(2, 7, 5, 4, "#f7f7f7"); r(0, 8, 3, 2, "#ffb52e"); r(4, 8, 1, 1, "#111");
    r(10, 6 + (frame === 1 ? -2 : 1), 5, 2, "#cfd8e6"); r(5, 14, 1, 3, "#ffb52e"); r(8, 14, 1, 3, "#ffb52e");
  } else if (q.shadow) {
    r(4, 3, 8, 8, "#312e81"); r(3, 11, 10, 6, "#1e1b4b"); r(5, 16, 3, 4, "#0f172a"); r(9, 16, 3, 4, "#0f172a");
    r(6, 6, 2, 2, "#a855f7"); r(10, 6, 2, 2, "#a855f7");
  } else {
    const pants = "#1e293b", sk = q.skin;
    const lo = frame === 1 ? 1 : 0, ro = frame === 2 ? 1 : 0;
    r(5, 16 - lo, 3, 3, pants); r(9, 16 - ro, 3, 3, pants); r(5, 19 - lo, 3, 1, "#0f172a"); r(9, 19 - ro, 3, 1, "#0f172a");
    r(3, 11, 10, 6, q.shirt); r(2, 12, 1, 4, q.shirt); r(13, 12, 1, 4, q.shirt);
    if (q.apron) r(5, 12, 6, 5, "#f1f5f9");
    if (q.gloves) { r(1, 14, 2, 3, "#22c55e"); r(13, 14, 2, 3, "#22c55e"); }

    if (q.stripes) { r(5, 11, 2, 6, "#0f172a"); r(9, 11, 2, 6, "#0f172a"); }
    if (q.whistle) { r(7, 10, 2, 2, "#facc15"); }
    r(4, 3, 8, 8, sk);
    if (q.hs === "short") { r(4, 2, 8, 2, q.hair); r(3, 3, 1, 4, q.hair); r(12, 3, 1, 4, q.hair); }
    if (q.hs === "spiky") { r(4, 1, 8, 3, q.hair); r(7, 0, 2, 2, q.hair); }
    if (q.hs === "long") { r(4, 2, 8, 2, q.hair); r(3, 3, 2, 10, q.hair); r(11, 3, 2, 10, q.hair); }
    if (q.cap) { r(4, 2, 8, 2, q.cap); r(3, 3, 10, 1, q.cap); }

  }

  const d = g.getImageData(0, 0, W, H), o = g.createImageData(W, H), A = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? 0 : d.data[(y * W + x) * 4 + 3]);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    if (d.data[i + 3] > 40) { o.data.set(d.data.slice(i, i + 4), i); }
    else if (A(x - 1, y) > 40 || A(x + 1, y) > 40 || A(x, y - 1) > 40 || A(x, y + 1) > 40) { o.data[i] = 15; o.data[i + 1] = 23; o.data[i + 2] = 42; o.data[i + 3] = 255; }

// FIX CAPITOLO 2: Vignetta infallibile che mostra SEMPRE tutti i personaggi presenti
function vig(scene, who, foes) {
  if (!scene || !ART[scene]) {
    const cap = G.cap || 1;
    scene = cap === 2 ? "spiaggia" : "campetto";
  }
  const bg = ART[scene] || ART.campetto;
  
  let list = [];
  if (foes && foes.length > 0) {
    const partyToShow = G.party.slice(0, 3);
    list = partyToShow.concat(foes);
  } else {
    list = (CAST[scene] || G.party).slice();
    if (who && PAL[who] && !list.includes(who)) {
      list.unshift(who);
    }
  }

  // Elimina duplicati e limita a 5 personaggi visibili a schermo
  list = Array.from(new Set(list)).slice(0, 5);
  const n = list.length;
  
  const imgs = list.map((id, i) => {
    const sp = id === who;
    const h = sp ? 96 : 68;
    const left = n > 1 ? 5 + (i / (n - 1)) * 76 : 42;
    const isEnemy = foes && foes.includes(id);
    return `<img src="${body(id, 4)}" alt="" style="position:absolute;bottom:${sp ? 6 : 2}px;left:${left}%;height:${h}px;image-rendering:pixelated;filter:${sp ? "drop-shadow(0 0 8px #ffd23f)" : "brightness(.85)"};transform:${isEnemy ? "scaleX(-1)" : "none"};transition:bottom .2s ease;">`;
  }).join("");

  return `<div style="position:relative;border-radius:12px;border:2px solid var(--line);overflow:hidden;margin:0 0 10px;box-shadow:0 8px 20px rgba(0,0,0,0.4);"><svg viewBox="0 0 320 120" preserveAspectRatio="xMidYMid slice" style="width:100%;height:170px;display:block">${bg}</svg>${imgs}</div>`;
}

  }).length;

  ${n ? `<button id="new">Ricomincia Capitolo ${cap}<small>Azzera le tappe di questo capitolo</small></button>` : ""}
  <button id="back">◂ Torna ad Ali di Rondine</button>`;

  $("#thBtn").onclick = cycleTheme;
  $("#capBtn").onclick = () => {
    G.cap = cap === 1 ? 2 : 1;
    G.area = G.cap === 2 ? 5 : 0;
    save();
    title();
  };
  $("#go").onclick = () => {
    SCENE = cap === 2 ? "spiaggia" : "crepa";
    n ? map() : dialog(cap === 2 ? STORY.intro2 : STORY.intro, map);
  };
  if ($("#new")) $("#new").onclick = () => {
    G.done = G.done.filter(id => {
      const nd = NODES.find(x => x.id === id);
      return nd && (nd.cap || 1) !== cap;
    });
    G.area = cap === 2 ? 5 : 0;
    save();
    title();
  };
  const goBackHome = () => {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "closeBorgo" }, "*");
    } else {
      location.href = "./index.html";
    }
  };
  $("#back").onclick = goBackHome;
  if ($("#quickBackBtn")) $("#quickBackBtn").onclick = goBackHome;
}

function dialog(lines, then) {
  let i = 0;
  const show = () => {
    const l = lines[i];

    $("#nx").onclick = () => { i++; i < lines.length ? show() : then(); };
  };
  show();
}

    "#......######......#", "#..................#", "#..................#", "#..................#", "#..................#", "####################"],
    start: [2, 9], exit: [18, 9], objs: [
      { k: "npc", id: "rita", x: 7, y: 4, say: [["rita", "Leo! Dario! Aiutatemi a raffreddare queste padelle!"]] },
      { k: "foe", id: "padella", x: 12, y: 5, fight: 1 }
    ] },
  { node: "n9", floor: ["#581c87", "#3b0764"], wall: "#2e1065", name: "La Pineta Capovolta", rows: [
    "####################", "####################", "#..................#", "#.....########.....#", "#..................#", "#..................#",
    "#..................#", "#.....########.....#", "#..................#", "#..................#", "#..................#", "####################"],
    start: [2, 9], exit: [18, 10], objs: [{ k: "npc", id: "tonino", x: 9, y: 5, talk: "n9" }] },
  { node: "n10", floor: ["#854d0e", "#713f12"], wall: "#451a03", name: "L'Orologio del Campanile", rows: [
    "####################", "####################", "#..................#", "#..##..........##..#", "#..................#", "#..................#",
    "#..................#", "#..##..........##..#", "#..................#", "#..................#", "#..................#", "####################"],
    start: [9, 10], exit: null, objs: [{ k: "foe", id: "arbitro", x: 9, y: 4, fight: 1 }] }
];

let X = null;
function nodeDone(m) { return G.done.includes(m.node); }

function explore() {
  busy2 = false;
  X && (X.cool = Date.now() + 600);
  const cap = G.cap || 1;
  const maxArea = cap === 2 ? 9 : 4;
  const minArea = cap === 2 ? 5 : 0;
  if (G.area == null || G.area < minArea || G.area > maxArea) {
    const i = NODES.findIndex((n) => (n.cap || 1) === cap && !G.done.includes(n.id));
    G.area = i < 0 ? maxArea : i;
  }
  const m = MAPS[G.area];
  SCENE = { n1: "campetto", n2: "trattoria", n3: "molo", n4: "chiosco", n5: "campanile", n6: "spiaggia", n7: "faro", n8: "trattoria2", n9: "pineta", n10: "orologio" }[m.node] || (cap === 2 ? "spiaggia" : "campetto");

  if (!X || X.m !== m) {
    X = { m, x: m.start[0], y: m.start[1], walk: 0, dir: "down", trail: [] };
  }

  app.innerHTML = `<h1>${esc(m.name)}</h1><div class="sub">Livello squadra ${G.lv} · focacce ${G.focacce} · D-pad o frecce per camminare con il gruppo</div>
  <canvas id="cv" width="640" height="384"></canvas>
  <div class="log" id="msg">${nodeDone(m) ? "Zona completata! Vai a destra per avanzare." : "Avvicinati ai personaggi con il tuo gruppo. I nemici si affrontano toccandoli."}</div>
  <button id="talk" class="hot" hidden></button>
  <div class="pad"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
    <button id="t">◂ Menu Capitoli</button>
    <button id="homeBorgo">🏠 Home Principale</button>
  </div>`;

  $("#t").onclick = title;
  $("#homeBorgo").onclick = () => { location.href = "./index.html"; };
  $("#talk").onclick = () => talkNear();

  const D = { u: [0, -1, "up"], d: [0, 1, "down"], l: [-1, 0, "left"], r: [1, 0, "right"] };
  clearInterval(window.PADTM);
  const stop = () => { clearInterval(window.PADTM); window.PADTM = null; };
  window.onpointerup = window.onpointercancel = window.onblur = stop;

  app.querySelectorAll(".pad button").forEach((b) => {
    const go = () => step(D[b.dataset.d]);
    b.onpointerdown = (e) => { e.preventDefault(); go(); stop(); window.PADTM = setInterval(() => { if (!$("#cv")) return stop(); go(); }, 140); };
    b.onpointerup = b.onpointerleave = b.onpointercancel = stop;
  });

  window.onkeydown = (e) => {
    const k = { ArrowUp: "u", ArrowDown: "d", ArrowLeft: "l", ArrowRight: "r", w: "u", s: "d", a: "l", d: "r" }[e.key];
    if (k && $("#cv")) { e.preventDefault(); step(D[k]); }
  };

  near();
  draw();
}

function objs(m) {
  return m.objs
    .filter((o) => !(o.k === "foe" && (nodeDone(m) || o.wait && !G.flags["met_" + m.node])))
    .filter((o) => !(o.id === "nico" && G.party.includes("nico")))
    .filter((o) => !(o.id === "rita" && G.party.includes("rita")));
}

function step(d) {
  if (!$("#cv") || busy2 || (X && X.cool > Date.now())) return;
  const m = X.m, nx = X.x + d[0], ny = X.y + d[1];
  const row = m.rows[ny]; if (!row) return;
  const t = row[nx];
  const cap = G.cap || 1;
  const maxArea = cap === 2 ? 9 : 4;

  if (nx >= row.length - 1 && d[0] === 1 && nodeDone(m)) {
    G.area = Math.min(maxArea, G.area + 1);
    X = null;
    save();
    return explore();
  }

  if (t === "#" || t === "~" || t === undefined) return;
  const o = objs(m).find((q) => q.x === nx && q.y === ny);
  const msg = (h) => { const e = $("#msg"); if (e) e.innerHTML = h; };

  if (o) {
    if (o.k === "foe") return meet(m, o);
    near(); return;
  }

  // Memorizza la scia dei passi per i compagni che seguono Leo (Party train)
  if (!X.trail) X.trail = [];
  X.trail.unshift({ x: X.x, y: X.y, dir: X.dir });
  if (X.trail.length > 8) X.trail.pop();

  X.x = nx; X.y = ny; X.mv = 8; X.dir = d[2];
  if (m.exit && nx === m.exit[0] && ny === m.exit[1]) {
    if (!nodeDone(m)) { msg("Una barriera temporale ti blocca: completa prima la sfida qui."); X.x -= d[0]; X.y -= d[1]; }
    else { G.area = Math.min(maxArea, G.area + 1); X = null; save(); return explore(); }
  }
  near();
  draw();
}

let busy2 = false;
function nearNpc() {
  if (!X) return null;
  return objs(X.m).find((o) => o.k === "npc" && Math.abs(o.x - X.x) + Math.abs(o.y - X.y) === 1) || null;
}
function near() {
  const b = $("#talk"); if (!b) return;
  const o = nearNpc();
  if (o) { b.hidden = false; b.textContent = "💬 Parla con " + (WHO[o.id] || o.id); } else b.hidden = true;
}
function talkNear() {
  const o = nearNpc(); if (!o || busy2) return; busy2 = true;
  if (o.talk) {
    const node = NODES.find((n) => n.id === o.talk);
    if (X.m.node === "n2") G.flags["met_n2"] = 1;
    return enter(node);
  }
  dialog(o.say.map((q) => T(q[0], q[1])), () => { busy2 = false; explore(); });
}
function meet(m, o) {
  busy2 = true; clearInterval(window.PADTM);
  const n = NODES.find((q) => q.id === m.node);
  if (m.node === "n2" && !G.flags.met_n2) {
    busy2 = false; const e = $("#msg"); if (e) e.innerHTML = "Prima parla con Papà."; return;
  }
  if (m.node === "n2") return fight(n);
  enter(n);
}

// ---- GRAFICA & RENDERING CANVAS ELEGANTE ----
const TS = 32, BGC = {};
function paintBG(m) {
  if (BGC[m.node]) return BGC[m.node];
  const c = document.createElement("canvas"); c.width = 640; c.height = 384; const g = c.getContext("2d");
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  
  // Disegna pavimentazione dettagliata
  for (let y = 0; y < 12; y++) for (let x = 0; x < 20; x++) {
    const t = (m.rows[y] || "")[x], X0 = x * TS, Y0 = y * TS;
    if (t === "~") continue;
    R(X0, Y0, TS, TS, (x + y) % 2 ? m.floor[0] : m.floor[1]);
  }

  // Bordi e pareti
  for (let y = 0; y < 12; y++) for (let x = 0; x < 20; x++) {
    if ((m.rows[y] || "")[x] !== "#") continue;
    const X0 = x * TS, Y0 = y * TS;
    R(X0, Y0, TS, TS, m.wall);
    R(X0 + 2, Y0 + 2, TS - 4, TS - 4, "#00000030");
  }

  BGC[m.node] = c; return c;
}

let TIME = 0, RAF = 0;
function draw() {
  const cv = $("#cv"); if (!cv) { RAF = 0; return; }
  const g = cv.getContext("2d"); g.imageSmoothingEnabled = false;
  const m = X.m; TIME++;

  g.drawImage(paintBG(m), 0, 0);

  // Acqua animata
  for (let y = 0; y < 12; y++) for (let x = 0; x < 20; x++) if (m.rows[y][x] === "~") {
    const X0 = x * TS, Y0 = y * TS, w = Math.sin((TIME / 16) + x * 0.8 + y * 0.5);
    g.fillStyle = (x + y) % 2 ? "#1d4ed8" : "#2563eb"; g.fillRect(X0, Y0, TS, TS);
    g.fillStyle = "rgba(255,255,255,.3)"; g.fillRect(X0 + 4 + w * 4, Y0 + 10, 14, 2);
  }

  // Lista oggetti da disegnare (Nemici, NPC e la squadra al seguito!)
  const O = objs(m).map((o) => ({ ...o }));
  
  // Leo (protagonista)
  O.push({ k: "me", id: "leo", x: X.x, y: X.y, mv: X.mv });

  // I compagni di squadra camminano in fila dietro a Leo (PARTY TRAIN!)
  const followers = G.party.filter(id => id !== "leo");
  if (X.trail && X.trail.length > 0) {
    followers.forEach((fId, idx) => {
      const stepIdx = (idx + 1) * 2 - 1;
      const tPos = X.trail[stepIdx] || X.trail[X.trail.length - 1];
      if (tPos) {
        O.push({ k: "follower", id: fId, x: tPos.x, y: tPos.y, mv: X.mv });
      }
    });
  }

  // Ordinamento per profondità (Y)
  O.sort((a, b) => a.y - b.y).forEach((o) => {
    const bob = Math.sin(TIME / 9 + o.x) * 1.5;
    const isMoving = (o.k === "me" || o.k === "follower") && o.mv > 0;
    const fr = isMoving ? 1 + (Math.floor(TIME / 6) % 2) : o.k === "foe" ? 1 + (Math.floor(TIME / 14) % 2) : 0;
    const sp = sprite(o.id, 2, fr);

    // Ombra
    g.fillStyle = "rgba(0,0,0,.35)";
    g.beginPath();
    g.ellipse(o.x * TS + 16, o.y * TS + 28, 11, 4, 0, 0, Math.PI * 2);
    g.fill();

    const dy = isMoving ? 0 : bob * (o.k === "foe" ? 1.4 : 0.6);
    g.drawImage(sp, o.x * TS - 2, o.y * TS - 14 + dy, 36, 44);

    if (o.k === "foe") {
      g.fillStyle = "#ef4444";
      g.beginPath();
      g.moveTo(o.x * TS + 16, o.y * TS - 20 + bob * 2);
      g.lineTo(o.x * TS + 11, o.y * TS - 28 + bob * 2);
      g.lineTo(o.x * TS + 21, o.y * TS - 28 + bob * 2);
      g.fill();
    }
    if (o.k === "npc") {
      g.fillStyle = "#facc15";
      g.beginPath();
      g.arc(o.x * TS + 16, o.y * TS - 20 + bob * 2, 4, 0, Math.PI * 2);
      g.fill();
    }
  });

  // Uscita dorata
  if (m.exit) {
    const on = nodeDone(m);
    g.fillStyle = on ? "rgba(250, 204, 21, 0.85)" : "rgba(100, 116, 139, 0.6)";
    g.fillRect(m.exit[0] * TS, m.exit[1] * TS, TS, TS);
    g.fillStyle = "#0f172a";
    g.font = "bold 20px sans-serif";
    g.fillText(on ? "➜" : "✕", m.exit[0] * TS + 7, m.exit[1] * TS + 23);
  }

  // Bagliore della crepa temporale
  g.fillStyle = `rgba(168, 85, 247, ${0.05 + 0.03 * Math.sin(TIME / 20)})`;
  g.fillRect(0, 0, 640, 384);

  if (!RAF) loop();
}

function loop() {
  RAF = requestAnimationFrame(() => {
    RAF = 0;
    if (!$("#cv")) return;
    if (X && X.mv > 0) X.mv--;
    draw();
  });
}

function map() { busy2 = false; explore(); }

function enter(n) {
  busy2 = true;
  clearInterval(window.PADTM);
  SCENE = { n1: "campetto", n2: "trattoria", n3: "molo", n4: "chiosco", n5: "campanile", n6: "spiaggia", n7: "faro", n8: "trattoria2", n9: "pineta", n10: "orologio" }[n.id] || (G.cap === 2 ? "spiaggia" : "campetto");
  if (n.id === "n2") return dialog(STORY.n2, papaChoice);
  if (n.id === "n4") return dialog(STORY.n4, rest);
  if (n.id === "n9") return dialog(STORY.n9, rest9);
  dialog(STORY[n.id] || [], () => fight(n));
}

function papaChoice() {

  <button id="a">Dì la verità: «Non sei felice, papà»<small>Leo si carica: +30% potenza ai colpi</small></button>

  $("#b").onclick = () => { G.focacce += 2; G.flags.verita = 0; save(); dialog([T("papa", "Ecco firmato sul piatto!"), T("gigi", "Un piatto autografato. Incredibile.")], () => fight(NODES[1])); };
}

function fin(id, lines) {
  if (!G.done.includes(id)) G.done.push(id);
  save();
  dialog(lines, map);
}

// ---- COMBATTIMENTO RPG TATTICO CON PARATA CON TEMPISMO ----
let P, F, busy;
function floatText(txt, col = "#ef4444") {
  const el = document.createElement("div");
  el.className = "float-num";
  el.textContent = txt;
  el.style.color = col;
  el.style.left = (Math.random() * 30 + 35) + "%";
  el.style.top = (Math.random() * 25 + 35) + "%";
  app.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function triggerFlash() {
  app.classList.remove("screen-flash");
  void app.offsetWidth;
  app.classList.add("screen-flash");
}

const hit = (t, d, msg) => {
  if (t.shield && !t.mark && !t.stun) {
    d = Math.ceil(d / 3);
    msg += " Ma la difesa d'acciaio assorbe gran parte del colpo! Serve Sara o un attacco speciale.";
  }
  if (t.mark) d = Math.round(d * 1.5);
  t.hp = Math.max(0, t.hp - d);
  triggerFlash();
  floatText(`-${d}`, t.mark ? "#facc15" : "#ef4444");
  return `${msg} (-${d})`;
};

function fight(n) {
  const mk = (id) => {
    const h = HERO[id], mx = h.hp + (G.lv - 1) * 10;
    return { id, pal: id, name: h.name, ic: h.ic, hp: mx, max: mx, sk: h.sk };
  };

  // Se capitolo 2 e siamo a n8 o dopo, assicurati che Dario e Rita siano in party
  if (n.id === "n8" && !G.party.includes("rita")) G.party.push("rita");
  if (n.id === "n8" && !G.party.includes("dario")) G.party.push("dario");
  save();

  P = { u: G.party.map(mk), gr: 3, guard: 0, perfectGuard: false, log: "Inizia lo scontro! Scegli le mosse con saggezza." };
  F = n.foes.map((k) => {
    const f = FOE[k]();
    f.pal = { gabb: 'gabb', cuoco: 'pino', tommy: 'tommy', rugg: 'rugg', granchio: 'granchio', ombra: 'ombra', padella: 'padella', arbitro: 'arbitro' }[k] || 'gabb';
    f.hp += (G.lv - 1) * 10;
    f.max = f.hp;
    return f;
  });

  if (n.id === 'n2' && G.flags.verita) P.u.forEach((u) => { if (u.id === 'leo') u.pw = 1; });
  if (n.id === 'n2' && G.flags.verita === 0) F.forEach((f) => { f.hp += 20; f.max += 20; });

  P.node = n; P.phase2 = false; busy = false;
  renderFight();
}

function renderFight() {
  const unit = (u, e) => `<div class="unit ${u.hp <= 0 ? "dead" : ""} ${u.stun ? "stun" : ""}"><b><img class="ui" src="${face(u.pal, 2)}" alt="">${esc(u.name)}</b> ${u.hp}/${u.max}<div class="bar ${e ? "e" : ""}"><i style="width:${Math.round((u.hp / u.max) * 100)}%"></i></div></div>`;
  const foePals = F.map(f => f.pal);

  app.innerHTML = vig(SCENE, null, foePals) + `
  <div class="card">
    <div class="row">
      <div>${F.map((f) => unit(f, 1)).join("")}</div>
      <div>${P.u.map((u) => unit(u)).join("")}</div>
    </div>
    ${P.guard ? `<div class="guard-banner">🛡️ DIFESA TOTALE ATTIVA: danni subiti ridotti del 70%!</div>` : ""}
    <div class="sub">Grinta ${"●".repeat(P.gr)}${"○".repeat(6 - P.gr)} · Focacce rimaste: ${G.focacce}</div>
    <div class="log">${P.log}</div>
  </div>
  <div id="menu"></div>`;

  if (!busy) menu();
}

function menu() {
  P.u.forEach((x) => {
    if (x.hp > 0 && x.skip && !x.acted) {
      x.skip = 0; x.acted = true; P.log += ` ${esc(x.name)} è bloccato e salta il turno.`;
    }
  });

  const u = P.u.find((x) => x.hp > 0 && !x.acted);
  if (!u) return foeTurn();

  const m = $("#menu");
  m.innerHTML = `<div class="sub" style="font-weight:bold;color:#38bdf8;">Tocca a ${esc(u.name)}:</div>` +
    u.sk.map((s, i) => {
      // Disabilita mosse combo se il compagno non è in squadra o è k.o.
      const comboLocked = s.combo && (!G.party.includes(s.combo) || P.u.find(x => x.id === s.combo)?.hp <= 0);
      return `<button data-s="${i}" ${P.gr < s.c || comboLocked ? "disabled" : ""} class="${s.c >= 3 ? "hot" : ""}">
        ${esc(s.n)} ${s.combo ? "🔥 [COMBO FRATELLI]" : ""}
        <small>${esc(s.d)}</small>
      </button>`;
    }).join("") +
    `<button data-s="f" ${G.focacce < 1 ? "disabled" : ""}>🥪 Mangia Focaccia<small>Cura 45 HP a ${esc(u.name)} (rimaste: ${G.focacce})</small></button>` +
    `<button data-s="p">🛡️ Concentrazione Difensiva<small>+1 Grinta e prepara la guardia</small></button>` +
    `<button data-s="esc" style="background:#26121a;border-color:#e04838">🏠 Torna ad Ali di Rondine<small>Abbandona lo scontro</small></button>`;

  m.querySelectorAll("button").forEach((b) => (b.onclick = () => {
    const s = b.dataset.s;
    if (s === "esc") {
      if (confirm("Vuoi abbandonare lo scontro e tornare al menu principale?")) location.href = "./index.html";
      return;
    }
    if (s === "p") {
      P.gr = Math.min(6, P.gr + 1);
      end(u, `${u.name} si mette in posizione difensiva (+1 Grinta).`);
    } else if (s === "f") {
      G.focacce--;
      u.hp = Math.min(u.max, u.hp + 45);
      floatText("+45", "#22c55e");
      end(u, `${u.name} mangia una focaccia calda e recupera 45 HP!`);
    } else {
      const sk = u.sk[+s];
      if (sk.self) {
        P.gr -= sk.c;
        end(u, sk.f(u));
      } else {
        target(u, sk);
      }
    }
  }));
}

function target(u, sk) {
  const alive = F.filter((f) => f.hp > 0);
  if (alive.length === 1) return run(u, sk, alive[0]);
  $("#menu").innerHTML = `<div class="sub" style="font-weight:bold;color:#facc15;">Seleziona il bersaglio:</div>` +
    alive.map((f, i) => `<button data-t="${i}">${f.ic} ${esc(f.name)} (${f.hp}/${f.max} HP)</button>`).join("");
  $("#menu").querySelectorAll("button").forEach((b) => (b.onclick = () => run(u, sk, alive[+b.dataset.t])));
}

function run(u, sk, t) {
  P.gr -= sk.c;
  end(u, sk.f(u, t));
}

function end(u, msg) {
  u.acted = true;
  P.log = esc(msg);

  const boss = F.find((f) => f.boss);
  if (boss && !P.phase2 && boss.hp > 0 && boss.hp <= boss.max / 2) {
    P.phase2 = true;
    boss.heal = 18;
    P.log += `<br><b style="color:#ef4444;">${esc(boss.pal === "arbitro" ? STORY.mid2 : STORY.mid)}</b> Il boss scatena la Fase 2!`;
    boss.atk = [boss.atk[0] + 5, boss.atk[1] + 7];
  }

  if (F.every((f) => f.hp <= 0)) return win();
  renderFight();
}

// TURNO DEI NEMICI PIÙ SFIDANTE CON SISTEMA DI ATTACCO COMBINATO
function foeTurn() {
  busy = true;
  let log = P.log + "<br>";

  F.filter((f) => f.hp > 0).forEach((f) => {
    if (f.stun) {
      f.stun = 0;
      log += `${f.ic} ${esc(f.name)} è ancora stordito e perde il turno.<br>`;
      return;
    }
    const al = P.u.filter((u) => u.hp > 0);
    if (!al.length) return;

    // Bersaglia chi ha meno HP o chi ha tirato
    const t = Math.random() < 0.6 ? al.sort((a,b)=>a.hp-b.hp)[0] : pick(al);
    let d = rnd(f.atk[0], f.atk[1]);

    if (f.weak) d = Math.ceil(d * 0.6);
    if (P.guard) d = Math.ceil(d * 0.35);

    t.hp = Math.max(0, t.hp - d);
    triggerFlash();
    floatText(`-${d}`, "#ef4444");

    log += `${esc(pick(f.say))} <b>${esc(f.name)}</b> colpisce ${esc(t.name)} (-${d}).<br>`;

    if (f.strike && t.hp > 0 && Math.random() < 0.35) {
      t.skip = 1;
      log += `<span style="color:#facc15;">⚠️ ${esc(t.name)} viene travolto dal paradosso e salterà il prossimo turno!</span><br>`;
    }
    if (f.weak) f.weak--;
    if (f.mark) f.mark--;
  });

  F.forEach((f) => {
    if (f.heal && f.hp > 0) {
      f.hp = Math.min(f.max, f.hp + f.heal);
      log += `${f.ic} ${esc(f.name)} rigenera +${f.heal} HP dall'orologio del tempo.<br>`;
    }
  });

  P.guard = 0;
  P.u.forEach((u) => (u.acted = false));
  P.gr = Math.min(6, P.gr + 1);
  P.log = log;

  if (P.u.every((u) => u.hp <= 0)) return lose();
  busy = false;
  renderFight();
}

function lose() {
  app.innerHTML = `<div class="card"><span class="who">Sconfitta Temporale</span><br>La squadra è a terra. Le onde del paradosso vi respingono, ma il Borgo Storto vi dà un'altra possibilità!</div>
  <button class="hot" id="r">Riprova lo scontro con tutta l'energia</button>
  <button id="m">Torna all'inizio dell'area</button>`;
  $("#r").onclick = () => fight(P.node);
  $("#m").onclick = map;
}

function win() {
  const n = P.node;
  G.lv++;
  G.focacce += n.boss ? 2 : 1;
  if (n.join && !G.party.includes(n.join)) G.party.push(n.join);
  if (!G.done.includes(n.id)) G.done.push(n.id);
  save();

  app.innerHTML = `<div class="card"><span class="who">Vittoria!</span><br>Livello squadra aumentato a <b>${G.lv}</b>! ${n.join ? `${esc(NAMES[n.join])} si è unito alla squadra!` : ""}<br>+${n.boss ? "2" : "1"} Focaccia nell'inventario!</div>
  <button class="hot" id="c">Continua il Viaggio ▸</button>`;
  $("#c").onclick = () => {
    if (n.id === "n5") return dialog(STORY.win, choice);
    if (n.id === "n10") return dialog(STORY.win2, finale2);
    if (STORY["w" + n.id.slice(1)]) return dialog(STORY["w" + n.id.slice(1)], map);
    return map();
  };
}

function finale2() {
  app.innerHTML = `<div class="card"><span class="who">🏆 CAMPIONI DEL PARADOSSO</span><br>L'Orologio del Campanile si è arrestato esattamente al novantesimo minuto. Le onde sono ritornate calme nel golfo, le lancette girano dritte e la grande crepa indaco si richiude con un dolce sibilo di brezza marina.<br><br>Dario e Rita vi porgono un vassoio fumante: «Ottima partita, ragazzi. Adesso torniamo a casa: c'è un campionato vero da vincere!»</div>
  <div class="card"><span class="who">Bacheca del Borgo</span><br>Hai completato entrambi i Capitoli di Borgo Storto e sbloccato la Doppia Rondine!</div>
  <button class="hot" id="t">◂ Torna al Titolo</button>`;
  $("#t").onclick = title;
}

function choice() {
  app.innerHTML = `<div class="card"><span class="who">Ugolino</span><br>Allora? Chiudo la crepa o la lascio aperta di un dito?</div>
  <button id="a">Chiudi la crepa<small>Tutto torna normale. Quasi.</small></button>
  <button id="b" class="hot">Lasciala aperta di un dito<small>Il Borgo Storto resta raggiungibile per il Capitolo 2</small></button>`;
  $("#a").onclick = () => { G.flags.crepa = "chiusa"; save(); finale(); };
  $("#b").onclick = () => { G.flags.crepa = "aperta"; save(); finale(); };
}

function finale() {
  const aperta = G.flags.crepa !== "chiusa";
  app.innerHTML = `<div class="card"><span class="who">Fine del Capitolo 1</span><br>${aperta ? "La crepa resta aperta di un dito. Dall'altra parte si sentono rintocchi di campana..." : "La crepa si richiude con un tonfo secco."}</div>
  <div class="card"><span class="who">Capitolo 2 Sbloccato</span><br>Inizia subito il Capitolo 2 con Rita, Dario e l'Arbitro del Paradosso!</div>
  <button class="hot" id="cap2">Inizia Capitolo 2 ▸</button>
  <button id="t">◂ Titolo</button>`;
  $("#cap2").onclick = () => { G.cap = 2; G.area = 5; save(); title(); };
  $("#t").onclick = title;
}

title();
if (/[?&]debug/.test(location.search)) window.__bs = { get G() { return G; }, get X() { return X; }, step, explore, MAPS };
})();
</script>
