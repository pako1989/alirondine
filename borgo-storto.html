<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Borgo Storto · Ali di Rondine</title>
<style>
:root{--bg:#0e1424;--card:#172038;--line:#2c3a5e;--ink:#f1f4ff;--dim:#9aa8cf;--gold:#ffd23f;--red:#ff5d6c;--grn:#57d68d;--blu:#6fb3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px 40px}
#app{max-width:560px;margin:0 auto;padding-top:14px}
h1{font-size:22px;margin:4px 0 2px;color:var(--gold)}
.sub{color:var(--dim);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.who{display:inline-block;background:#43507a;border-radius:8px;padding:2px 10px;font-size:14px;margin-bottom:6px}
.big{font-size:44px;text-align:center;letter-spacing:6px;margin:6px 0}
button{display:block;width:100%;text-align:left;background:#1e2d57;color:var(--ink);border:2px solid #3b4f86;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
button small{display:block;color:var(--dim);font-size:13px}
button.hot{background:#2a3f7a;border-color:var(--gold)}
button:disabled{opacity:.4}
.bar{height:10px;border-radius:6px;background:#0a0f1d;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;background:var(--grn);transition:width .3s}
.bar.e i{background:var(--red)}
.row{display:flex;gap:8px}.row>div{flex:1}
.unit{font-size:14px}.unit b{font-size:15px}
.dead{opacity:.35}
.log{font-size:15px;color:#d7defa;min-height:3.2em}
.stun::after{content:" 💫"}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";
const K = "ali-di-rondine.borgostorto";
const $ = (s) => document.querySelector(s), app = $("#app");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const load = () => { try { const v = JSON.parse(localStorage.getItem(K)); return v && v.v === 1 ? v : null; } catch { return null; } };
const save = () => { try { localStorage.setItem(K, JSON.stringify(G)); } catch {} };
let G = load() || { v: 1, done: [], party: ["leo", "gigi", "sara"], lv: 1, focacce: 2, flags: {} };

// ---- personaggi ----
const HERO = {
  leo:  { name: "Leo", ic: "⚽", hp: 70, sk: [
    { n: "Tiro", d: "danno 10-16", c: 0, f: (u, t) => hit(t, Math.round((rnd(10, 16) + G.lv * 2) * (u.pw ? 1.3 : 1)), `${u.name} calcia dritto in faccia a ${t.name}.`) },
    { n: "Tiro della Rondine", d: "danno 28-36 · grinta 3", c: 3, f: (u, t) => hit(t, Math.round((rnd(28, 36) + G.lv * 3) * (u.pw ? 1.3 : 1)), `TIRO DELLA RONDINE! ${t.name} guarda il pallone passare e non fa in tempo a offendersi.`) } ] },
  gigi: { name: "Gigi", ic: "🕊️", hp: 55, sk: [
    { n: "Chiacchiera", d: "danno 6-10, il nemico fa meno male", c: 0, f: (u, t) => { t.weak = 2; return hit(t, rnd(6, 10) + G.lv, `Gigi parla per quaranta secondi senza respirare. ${t.name} cede per sfinimento.`); } },
    { n: "KRAAA!", d: "stordisce un nemico · grinta 2", c: 2, f: (u, t) => { t.stun = 1; return `${u.name} imita un gabbiano così bene che ${t.name} si gira a controllare. È fermo un turno.`; } } ] },
  sara: { name: "Sara", ic: "📓", hp: 55, sk: [
    { n: "Appunti taglienti", d: "danno 9-13", c: 0, f: (u, t) => hit(t, rnd(9, 13) + G.lv * 2, `Sara legge ad alta voce le sue statistiche su ${t.name}. Fanno più male di un calcio.`) },
    { n: "Analisi", d: "il nemico prende +50% per 2 turni · grinta 2", c: 2, f: (u, t) => { t.mark = 2; return `«Punto debole: tutto.» ${t.name} si sente osservato e peggiora.`; } } ] },
  nico: { name: "Nico", ic: "🧤", hp: 80, sk: [
    { n: "Parata", d: "cura sé stesso di 25", c: 0, self: 1, f: (u) => { u.hp = Math.min(u.max, u.hp + 25); return `Nico si para da solo. Funziona, nessuno ha chiesto come.`; } },
    { n: "Gatto Volante", d: "squadra riparata per un turno · grinta 2", c: 2, self: 1, f: (u) => { P.guard = 1; return `GATTO VOLANTE! Nico si butta davanti a tutti. Il pavimento ci rimane male.`; } } ] },
};
const NAMES = { leo: "Leo", gigi: "Gigi", sara: "Sara", nico: "Nico" };

// ---- nemici ----
const FOE = {
  gabb: () => ({ name: "Gabbiano Sindacalista", ic: "🐦", hp: 34, atk: [5, 9], strike: 1, say: ["«Pausa pranzo, stronzo.»", "«Chiedi alla RSU dei gabbiani.»", "«Sciopero del cielo!»"] }),
  cuoco: () => ({ name: "Pino Con Più Braccia", ic: "🍝", hp: 55, atk: [7, 11], say: ["«Otto frittelle alla volta, bello!»", "«Il menu è solo in latino!»"] }),
  tommy: () => ({ name: "Tommy Senza Difetti", ic: "😇", hp: 70, atk: [8, 13], shield: 1, say: ["«Non sbaglio mai.»", "«Non perdo mai.»", "«Non ho mai fame.»"] }),
  rugg: () => ({ name: "Ruggeri Gentile", ic: "🥰", hp: 210, atk: [11, 16], boss: 1, heal: 0, say: ["«Che bravi che siete, davvero!»", "«Un abbraccio non ha mai fatto male a nessuno.»", "«Siete tutti perfetti. Restate qui.»"] }),
};

// ---- storia ----
const T = (who, text) => ({ who, text });
const STORY = {
  intro: [
    T(null, "Sera sul campetto del Borgo. L'allenamento è finito. Ugolino Lampadina è sul tetto del campanile con due cavi e un flipper."),
    T("ugolino", "Ho collegato il campanile al flipper per fare una luminaria «dinamica». È andata benissimo. Fino a quando è andata malissimo."),
    T(null, "Nel cielo si apre una crepa verde, larga come una busta della spesa."),
    T("gigi", "Cazzo. Il cielo si è aperto come un sacchetto del pane."),
    T("sara", "Statisticamente è la cosa più improbabile mai successa al Borgo. E abbiamo un precedente col campanile."),
    T("leo", "Qualcuno guardi dentro. No, non io. Va bene, io."),
    T(null, "Entrate. Dall'altra parte c'è il Borgo. Ma qualcosa è storto: il campanile pende, le barche hanno le ruote, e tutti i gabbiani hanno un cartellino con il nome."),
  ],
  n1: [T("gigi", "Questo è il Borgo Storto. Lo capisco da come i gabbiani ci guardano male."), T(null, "Due gabbiani con la sciarpa del sindacato vi bloccano il passaggio.")],
  w1: [T("sara", "Appunto: dopo l'ultimo sciopero hanno chiesto anche i weekend. Andiamo."), T("gigi", "Mi hanno quasi convinto. Quasi.")],
  n2: [
    T(null, "La Trattoria Moretti è aperta. Dentro c'è un uomo con la maglia numero 9 incorniciata sul muro. È papà Moretti, ma qui è un'altra persona."),
    T("papa", "Ragazzi! Sono il 9 della nazionale da vent'anni. Firmo autografi sui piatti."),
    T("leo", "…Papà? Qui hai continuato a giocare?"),
    T("papa", "Sì. Ho tre scudetti, due Palloni d'oro e nessuno che mi prepara le acciughe."),
    T("leo", "E sei felice?"),
    T("papa", "…Sono famoso. È diverso."),
    T(null, "Leo non risponde. Dalla cucina esce Pino, ma con otto braccia, e vi guarda male."),
  ],
  w2: [T("leo", "Andiamo. Non voglio più sentire che qui «papà vince»."), T("sara", "Appunto. Non ti ha neanche chiesto come stai.")],
  n3: [
    T(null, "Al molo c'è una porta da calcio sul mare, e dentro, in fondo, c'è Nico che para da ore. Sempre lo stesso tiro. Sempre da Tommy."),
    T("tommy", "Ciao ragazzi. Non perdo mai, non sbaglio mai e non ho mai fame."),
    T("gigi", "Fa schifo. Voglio il Tommy vero."),
    T("nico", "Aiuto! Sono in questa porta da un tempo che non so! Ho parato quattrocento volte lo stesso tiro!"),
  ],
  w3: [T("nico", "Grazie. Ho fatto il conto: quattrocento parate. Non è neanche un record. Che umiliazione."), T("gigi", "Il Tommy vero non sarebbe mai perfetto: sarebbe in ritardo e con la focaccia in mano."), T(null, "Nico si unisce alla squadra.")],
  n4: [
    T(null, "Il chiosco di Tonino. Sulla lavagna: «Gusto del giorno: Paradosso». Costa un euro e il futuro."),
    T("tonino", "Chi lo assaggia sta benissimo per un'ora. Poi inizia a ricordarsi cose che non sono successe."),
  ],
  n5: [
    T(null, "Il campanile storto. In cima, al posto del flipper, c'è il Mister. Sorride. Troppo."),
    T("rugg", "Ragazzi! Che bello vedervi! Qui nessuno si arrabbia mai. Nessuno corre. Nessuno perde. Rimanete."),
    T("sara", "È Ruggeri… gentile. È la cosa più inquietante che abbia visto."),
    T("leo", "Mister, il Ruggeri vero urlava. Ma ci ha insegnato a giocare."),
    T("rugg", "Urlare non serve. Io vi voglio bene e basta."),
  ],
  mid: "«Ho detto che vi voglio bene. Avevo anche un'altra squadra, una volta. Non l'ho allenata abbastanza.»",
  win: [
    T("rugg", "…Va bene. Vi lascio andare. Ricordatemi urlare, ogni tanto."),
    T("ugolino", "Ragazzi! Ho trovato l'interruttore! Se lo giro la crepa si chiude. Se lo lascio così, rimane aperta di un dito."),
  ],
};
const WHO = { ugolino: "Ugolino", papa: "Papà Moretti", tommy: "Tommy (perfetto)", tonino: "Tonino", rugg: "Mister Ruggeri", leo: "Leo", gigi: "Gigi", sara: "Sara", nico: "Nico" };

// ---- mappa ----
const NODES = [
  { id: "n1", t: "Il campetto storto", sub: "Due gabbiani sindacalizzati", foes: ["gabb", "gabb"] },
  { id: "n2", t: "Trattoria Moretti", sub: "Papà è famoso", foes: ["cuoco"] },
  { id: "n3", t: "Il molo", sub: "Nico è chiuso in una porta", foes: ["tommy"], join: "nico" },
  { id: "n4", t: "Il chiosco di Tonino", sub: "Pausa e gelato" , rest: 1 },
  { id: "n5", t: "Il campanile storto", sub: "Il Mister è troppo gentile", foes: ["rugg"], boss: 1 },
];

// ---- grafica: scenette SVG senza file esterni ----
const ART = {
  crepa: '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1030"/><stop offset="1" stop-color="#24365e"/></linearGradient></defs><rect width="320" height="120" fill="url(#g)"/><circle cx="40" cy="20" r="2" fill="#fff"/><circle cx="270" cy="30" r="1.5" fill="#fff"/><path d="M170 0 L162 22 L176 40 L160 62 L172 78" stroke="#5dff9a" stroke-width="5" fill="none"/><path d="M170 0 L162 22 L176 40 L160 62 L172 78" stroke="#c9ffe0" stroke-width="1.5" fill="none"/><polygon points="120,120 124,50 140,50 144,120" fill="#10172e" transform="rotate(-8 130 120)"/><rect x="0" y="108" width="320" height="12" fill="#143a2a"/>',
  campetto: '<rect width="320" height="120" fill="#4aa8d8"/><rect y="70" width="320" height="50" fill="#2e9a52"/><rect x="230" y="40" width="50" height="40" fill="none" stroke="#fff" stroke-width="3"/><g fill="#fff" stroke="#888"><ellipse cx="70" cy="36" rx="14" ry="7"/><ellipse cx="120" cy="22" rx="12" ry="6"/></g><g fill="#ffd23f"><circle cx="64" cy="34" r="2"/><circle cx="114" cy="20" r="2"/></g><path d="M0 70 L320 70" stroke="#fff" stroke-width="2" opacity=".5"/>',
  trattoria: '<rect width="320" height="120" fill="#3a2418"/><rect x="30" y="20" width="90" height="80" fill="#f2c976" stroke="#7a4a22" stroke-width="4"/><text x="75" y="75" font-size="52" fill="#b3202c" text-anchor="middle" font-family="sans-serif" font-weight="bold">9</text><rect x="170" y="35" width="120" height="60" rx="6" fill="#6a3a24"/><circle cx="200" cy="65" r="14" fill="#f4e6c8"/><circle cx="250" cy="65" r="14" fill="#f4e6c8"/><rect y="100" width="320" height="20" fill="#241008"/>',
  molo: '<rect width="320" height="120" fill="#6fb3d8"/><rect y="64" width="320" height="56" fill="#1d5f8f"/><path d="M0 80 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#9ed4f0" fill="none" stroke-width="2"/><rect x="110" y="30" width="100" height="56" fill="none" stroke="#fff" stroke-width="4"/><rect x="0" y="92" width="110" height="10" fill="#8a6540"/>',
  chiosco: '<rect width="320" height="120" fill="#ffe9b5"/><path d="M80 30 h160 l10 30 h-180 z" fill="#ff6a7a"/><path d="M80 30 h20 l-5 30 h-25z M120 30 h20 l-5 30 h-20z M160 30 h20 l-5 30 h-20z M200 30 h20 l-5 30 h-20z" fill="#fff"/><rect x="90" y="60" width="140" height="50" fill="#9a6a3a"/><polygon points="160,110 148,78 172,78" fill="#d9a05a"/><circle cx="160" cy="70" r="14" fill="#c9a0ff"/><circle cx="160" cy="70" r="5" fill="#fff" opacity=".6"/>',
  campanile: '<defs><radialGradient id="h"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#ffe9a000"/></radialGradient></defs><rect width="320" height="120" fill="#2a1a40"/><circle cx="170" cy="22" r="48" fill="url(#h)"/><polygon points="145,120 150,30 190,30 195,120" fill="#c9b8a8" transform="rotate(7 170 120)"/><rect x="152" y="40" width="30" height="24" fill="#2a1a40" transform="rotate(7 170 120)"/><polygon points="148,30 170,0 192,30" fill="#b3202c" transform="rotate(7 170 120)"/><text x="170" y="64" text-anchor="middle" font-size="20">🥰</text>',
};
const art = (k) => (ART[k] ? `<svg viewBox="0 0 320 120" style="width:100%;border-radius:12px;border:2px solid var(--line);display:block;margin:0 0 8px">${ART[k]}</svg>` : "");
let SCENE = "crepa";

// ---- UI ----
function title() {
  const n = G.done.length;
  app.innerHTML = `<h1>Il Borgo Storto</h1><div class="sub">GDR a capitoli · Capitolo 1: La crepa sul campanile</div>
  <div class="card">${art("crepa")}<p>Ugolino ha fatto un guaio. Il cielo ha una crepa, e dall'altra parte c'è un Borgo uguale al tuo. Quasi. Tutto è storto, tutti sono una versione strana di sé stessi. E non si sa chi comanda.</p></div>
  <button class="hot" id="go">${n ? "Continua" : "Inizia"}<small>${n ? `Tappe fatte: ${n}/5` : "Capitolo 1"}</small></button>
  ${n ? `<button id="new">Ricomincia da capo<small>Cancella i progressi di questo capitolo</small></button>` : ""}
  <button id="back">◂ Torna ad Ali di Rondine</button>`;
  $("#go").onclick = () => { SCENE = "crepa"; n ? map() : dialog(STORY.intro, map); };
  if ($("#new")) $("#new").onclick = () => { G = { v: 1, done: [], party: ["leo", "gigi", "sara"], lv: 1, focacce: 2, flags: {} }; save(); title(); };
  $("#back").onclick = () => { location.href = "./index.html"; };
}
function dialog(lines, then) {
  let i = 0;
  const show = () => {
    const l = lines[i];
    app.innerHTML = art(SCENE) + `<div class="card">${l.who ? `<span class="who">${esc(WHO[l.who] || l.who)}</span><br>` : ""}${esc(l.text)}</div><button class="hot" id="nx">Continua ▸</button>`;
    $("#nx").onclick = () => { i++; i < lines.length ? show() : then(); };
  };
  show();
}
function map() {
  const next = NODES.find((n) => !G.done.includes(n.id));
  if (!next) return finale();
  SCENE = "crepa"; app.innerHTML = `<h1>Mappa</h1><div class="sub">Livello squadra ${G.lv} · focacce ${G.focacce}</div>` +
    NODES.map((n, i) => { const d = G.done.includes(n.id), cur = next && next.id === n.id;
      return `<button data-i="${i}" class="${cur ? "hot" : ""}" ${d || !cur ? "disabled" : ""}>${d ? "✓ " : cur ? "▶ " : "🔒 "}${esc(n.t)}<small>${esc(n.sub)}</small></button>`; }).join("") +
    `<button id="t">◂ Titolo</button>`;
  app.querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => enter(NODES[+b.dataset.i])));
  $("#t").onclick = title;
}
function enter(n) {
  SCENE = { n1: "campetto", n2: "trattoria", n3: "molo", n4: "chiosco", n5: "campanile" }[n.id];
  if (n.id === "n2") return dialog(STORY.n2, papaChoice);
  if (n.rest) return dialog(STORY[n.id], rest);
  dialog(STORY[n.id], () => fight(n));
}
function papaChoice() {
  app.innerHTML = art(SCENE) + `<div class="card"><span class="who">Papà Moretti</span><br>Siete venuti per un autografo o per le acciughe?</div>
  <button id="a">Dì la verità: «Non sei felice, papà»<small>Leo si carica: colpi più forti nello scontro</small></button>
  <button id="b">Fai finta di niente e chiedi un autografo<small>Papà ti regala 2 focacce, ma Pino è più forte</small></button>`;
  $("#a").onclick = () => { G.flags.verita = 1; save(); dialog([T("leo", "Hai tutto, papà. Ma ti manca qualcuno che ti chiami a tavola. Lo so perché manca anche a me."), T("papa", "…Leo. Non dirlo ad alta voce. Poi lo so anch'io.")], () => fight(NODES[1])); };
  $("#b").onclick = () => { G.focacce += 2; G.flags.verita = 0; save(); dialog([T("papa", "Ecco, firmato sul piatto. Non lavarlo mai."), T("gigi", "Papà Moretti ha appena firmato un piatto come fosse un contratto.")], () => fight(NODES[1])); };
}
function rest() {
  app.innerHTML = art(SCENE) + `<div class="card"><span class="who">Tonino</span><br>Scegli bene. Il gelato non è una scelta neutra.</div>
  <button id="a">Assaggia il gusto Paradosso<small>La squadra guarisce del tutto. Ma si ricorderà di cose mai successe.</small></button>
  <button id="b" class="hot">Prendi due focacce e una granita<small>+2 focacce e il gruppo respira</small></button>`;
  $("#a").onclick = () => { G.flags.paradosso = 1; fin("n4", [T("tonino", "Stai benissimo. E ricordi che ieri hai segnato dall'altra parte del campo."), T("gigi", "Io mi ricordo un cane parlante. Era mio nonno.")]); };
  $("#b").onclick = () => { G.focacce += 2; fin("n4", [T("tonino", "Scelta noiosa e sana. Mi piaci."), T("sara", "Siamo qui da dieci minuti e questo è già il momento più normale.")]); };
}
function fin(id, lines) { if (!G.done.includes(id)) G.done.push(id); save(); dialog(lines, map); }

// ---- scontri a turni ----
let P, F, busy;
const hit = (t, d, msg) => { if (t.shield && !t.mark && !t.stun) { d = Math.ceil(d / 4); msg += " Ma Tommy è perfetto: il colpo scivola via. Serve Sara, o un modo per farlo sbagliare."; } if (t.mark) d = Math.round(d * 1.5); t.hp = Math.max(0, t.hp - d); return `${msg} (-${d})`; };
function fight(n) {
  const mk = (id) => { const h = HERO[id], mx = h.hp + (G.lv - 1) * 8; return { id, name: h.name, ic: h.ic, hp: mx, max: mx, sk: h.sk }; };
  P = { u: G.party.map(mk), gr: 3, guard: 0, log: "Inizia lo scontro." };
  F = n.foes.map((k) => { const f = FOE[k](); f.hp += (G.lv - 1) * 6; f.max = f.hp; return f; });
  if (n.id === 'n2' && G.flags.verita) P.u.forEach((u) => { if (u.id === 'leo') u.pw = 1; });
  if (n.id === 'n2' && G.flags.verita === 0) F.forEach((f) => { f.hp += 15; f.max += 15; });
  P.node = n; P.phase2 = false; busy = false; renderFight();
}
function renderFight() {
  const unit = (u, e) => `<div class="unit ${u.hp <= 0 ? "dead" : ""} ${u.stun ? "stun" : ""}"><b>${u.ic} ${esc(u.name)}</b> ${u.hp}/${u.max}<div class="bar ${e ? "e" : ""}"><i style="width:${Math.round((u.hp / u.max) * 100)}%"></i></div></div>`;
  app.innerHTML = art(SCENE) + `<div class="card"><div class="row"><div>${F.map((f) => unit(f, 1)).join("")}</div><div>${P.u.map((u) => unit(u)).join("")}</div></div>
  <div class="sub">Grinta ${"●".repeat(P.gr)}${"○".repeat(6 - P.gr)} · focacce ${G.focacce}</div><div class="log">${P.log}</div></div><div id="menu"></div>`;
  if (!busy) menu();
}
function menu() {
  P.u.forEach((x) => { if (x.hp > 0 && x.skip && !x.acted) { x.skip = 0; x.acted = true; P.log += ` ${esc(x.name)} è in sciopero.`; } });
  const u = P.u.find((x) => x.hp > 0 && !x.acted);
  if (!u) return foeTurn();
  const m = $("#menu");
  m.innerHTML = `<div class="sub">Tocca a ${esc(u.name)}</div>` + u.sk.map((s, i) => `<button data-s="${i}" ${P.gr < s.c ? "disabled" : ""}>${esc(s.n)}<small>${esc(s.d)}</small></button>`).join("") +
    `<button data-s="f" ${G.focacce < 1 ? "disabled" : ""}>Focaccia<small>cura 40 a ${esc(u.name)}</small></button><button data-s="p">Salta il turno<small>+1 grinta</small></button>`;
  m.querySelectorAll("button").forEach((b) => (b.onclick = () => {
    const s = b.dataset.s;
    if (s === "p") { P.gr = Math.min(6, P.gr + 1); end(u, `${u.name} respira e aspetta.`); }
    else if (s === "f") { G.focacce--; u.hp = Math.min(u.max, u.hp + 40); end(u, `${u.name} mangia una focaccia. Si sente meglio e leggermente unto.`); }
    else { const sk = u.sk[+s]; if (sk.self) { P.gr -= sk.c; end(u, sk.f(u)); } else target(u, sk); }
  }));
}
function target(u, sk) {
  const alive = F.filter((f) => f.hp > 0);
  if (alive.length === 1) return run(u, sk, alive[0]);
  $("#menu").innerHTML = `<div class="sub">Contro chi?</div>` + alive.map((f, i) => `<button data-t="${i}">${f.ic} ${esc(f.name)} (${f.hp})</button>`).join("");
  $("#menu").querySelectorAll("button").forEach((b) => (b.onclick = () => run(u, sk, alive[+b.dataset.t])));
}
function run(u, sk, t) { P.gr -= sk.c; end(u, sk.f(u, t)); }
function end(u, msg) {
  u.acted = true; P.log = esc(msg);
  const boss = F.find((f) => f.boss);
  if (boss && !P.phase2 && boss.hp > 0 && boss.hp <= boss.max / 2) { P.phase2 = true; boss.heal = 12; P.log += `<br><i>${esc(STORY.mid)}</i> Ruggeri smette di sorridere. Adesso fa sul serio.`; boss.atk = [boss.atk[0] + 4, boss.atk[1] + 5]; }
  if (F.every((f) => f.hp <= 0)) return win();
  renderFight();
}
function foeTurn() {
  busy = true; let log = P.log + "<br>";
  F.filter((f) => f.hp > 0).forEach((f) => {
    if (f.stun) { f.stun = 0; log += `${f.ic} ${esc(f.name)} è ancora stordito.<br>`; return; }
    const al = P.u.filter((u) => u.hp > 0); if (!al.length) return;
    const t = pick(al); let d = rnd(f.atk[0], f.atk[1]); if (f.weak) d = Math.ceil(d / 2); if (P.guard) d = Math.ceil(d / 3);
    t.hp = Math.max(0, t.hp - d);
    log += `${f.ic} ${esc(pick(f.say))} ${esc(f.name)} colpisce ${esc(t.name)} (-${d}).<br>`;
    if (f.strike && t.hp > 0 && Math.random() < 0.4) { t.skip = 1; log += `${esc(t.name)} viene coinvolto nello sciopero e salta il prossimo turno.<br>`; }
    if (f.weak) f.weak--; if (f.mark) f.mark--;
  });
  F.forEach((f) => { if (f.heal && f.hp > 0) { f.hp = Math.min(f.max, f.hp + f.heal); log += `${f.ic} ${esc(f.name)} abbraccia tutti. Cura ${f.heal}. Come si fa a prendere a calci uno così?<br>`; } });
  P.guard = 0; P.u.forEach((u) => (u.acted = false)); P.gr = Math.min(6, P.gr + 1); P.log = log;
  if (P.u.every((u) => u.hp <= 0)) return lose();
  busy = false; renderFight();
}
function lose() {
  app.innerHTML = `<div class="card"><span class="who">Narratore</span><br>Siete a terra. Una voce dice «Scusate, qui nessuno si fa male, per favore ricominciate». Il Borgo Storto vi rimette in piedi, con un po' di vergogna.</div><button class="hot" id="r">Riprova lo scontro</button><button id="m">Torna alla mappa</button>`;
  $("#r").onclick = () => fight(P.node); $("#m").onclick = map;
}
function win() {
  const n = P.node; G.lv++; G.focacce += n.boss ? 1 : 0;
  if (n.join && !G.party.includes(n.join)) G.party.push(n.join);
  if (!G.done.includes(n.id)) G.done.push(n.id); save();
  app.innerHTML = `<div class="card"><span class="who">Vittoria</span><br>Livello squadra ${G.lv}. ${n.join ? `${esc(NAMES[n.join])} si unisce alla squadra.` : ""}</div><button class="hot" id="c">Continua ▸</button>`;
  $("#c").onclick = () => (n.id === "n5" ? dialog(STORY.win, choice) : STORY["w" + n.id.slice(1)] ? dialog(STORY["w" + n.id.slice(1)], map) : map());
}
function choice() {
  app.innerHTML = `<div class="card"><span class="who">Ugolino</span><br>Allora? Chiudo la crepa o la lascio aperta di un dito?</div>
  <button id="a">Chiudi la crepa<small>Tutto torna come prima. Quasi.</small></button>
  <button id="b" class="hot">Lasciala aperta di un dito<small>Il Borgo Storto resta raggiungibile</small></button>`;
  $("#a").onclick = () => { G.flags.crepa = "chiusa"; save(); finale(); };
  $("#b").onclick = () => { G.flags.crepa = "aperta"; save(); finale(); };
}
function finale() {
  const aperta = G.flags.crepa !== "chiusa";
  app.innerHTML = `<div class="card"><span class="who">Fine del capitolo 1</span><br>${aperta ? "La crepa resta aperta di un dito. Dall'altra parte qualcosa ha sentito. Ugolino dice «È solo un gabbiano». Non è un gabbiano." : "La crepa si chiude con un rumore da sacchetto del pane. Il cielo torna a posto, ma dal campanile si sente ancora un piccolo «KRAAA». Gigi giura di non essere stato lui."}${G.flags.paradosso ? "<br><br><i>Qualcuno nel gruppo ricorda ancora il cane parlante. Sarà un problema.</i>" : ""}</div>
  <div class="card"><span class="who">Prossimamente</span><br>Capitolo 2: il Borgo Storto non ha finito con voi.</div><button id="t">◂ Titolo</button>`;
  $("#t").onclick = title;
}
title();
})();
</script>
