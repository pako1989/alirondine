<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Borgo Storto · Ali di Rondine</title>
<style>
:root{--bg:#0e1424;--card:#172038;--line:#2c3a5e;--ink:#f1f4ff;--dim:#9aa8cf;--gold:#ffd23f;--red:#ff5d6c;--grn:#57d68d;--blu:#6fb3ff}
body.theme-vintage{--bg:#191410;--card:#292019;--line:#473729;--ink:#f8f2e6;--dim:#baa48b;--gold:#e5a73b;--red:#cf3742;--grn:#52aa66;--blu:#4088d6}
body.theme-neon{--bg:#050b18;--card:#0d172e;--line:#00e5ff55;--ink:#f0faff;--dim:#7f9ec2;--gold:#ffd000;--red:#ff2d62;--grn:#00e676;--blu:#00e5ff}
body.theme-arcade{--bg:#0a1b0a;--card:#133313;--line:#2a572a;--ink:#d2f694;--dim:#7da54b;--gold:#e2c034;--red:#e04838;--grn:#5da832;--blu:#42b0d5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px 40px;transition:background .2s,color .2s}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn-icon{background:#1e2d57;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:4px 10px;font-size:15px;cursor:pointer}
.float-num{position:absolute;pointer-events:none;font-weight:bold;font-size:20px;text-shadow:1px 1px 3px #000;animation:floatUp .8s ease forwards;z-index:20}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-26px) scale(1.15)}}
.screen-flash{animation:flashHit .22s ease}
@keyframes flashHit{0%,100%{filter:none}50%{filter:brightness(1.5) contrast(1.2)}}
#app{max-width:560px;margin:0 auto;padding-top:14px}
h1{font-size:22px;margin:4px 0 2px;color:var(--gold)}
.sub{color:var(--dim);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.who{display:inline-block;background:#43507a;border-radius:8px;padding:2px 10px;font-size:14px;margin-bottom:6px}
.big{font-size:44px;text-align:center;letter-spacing:6px;margin:6px 0}
[hidden]{display:none!important}
button{display:block;width:100%;text-align:left;background:#1e2d57;color:var(--ink);border:2px solid #3b4f86;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
button small{display:block;color:var(--dim);font-size:13px}
button.hot{background:#2a3f7a;border-color:var(--gold)}
button:disabled{opacity:.4}
.bar{height:10px;border-radius:6px;background:#0a0f1d;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;background:var(--grn);transition:width .3s}
.bar.e i{background:var(--red)}
.row{display:flex;gap:8px}.row>div{flex:1}
.unit{font-size:14px}.unit b{font-size:15px}
.dead{opacity:.35}
.log{font-size:15px;color:#d7defa;min-height:3.2em}
.stun::after{content:" 💫"}
canvas#cv{width:100%;image-rendering:pixelated;border:2px solid var(--line);border-radius:12px;display:block;background:#000}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:10px auto}
.pad button{margin:0;text-align:center;font-size:22px;padding:14px 0;touch-action:manipulation}
.dlg{display:flex;gap:10px;align-items:flex-start}.dlg img{width:64px;height:64px;image-rendering:pixelated;border:2px solid var(--line);border-radius:10px;background:#0a0f1d;flex:none}
.ui{width:30px;height:30px;image-rendering:pixelated;vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";
const K = "ali-di-rondine.borgostorto";
const $ = (s) => document.querySelector(s), app = $("#app");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const load = () => { try { const v = JSON.parse(localStorage.getItem(K)); return v && v.v === 1 ? v : null; } catch { return null; } };
const save = () => { try { localStorage.setItem(K, JSON.stringify(G)); } catch {} };
let G = load() || { v: 1, done: [], party: ["leo", "gigi", "sara"], lv: 1, focacce: 2, flags: {} };

const THEMES = [
  { id: "classic", name: "Classico", cls: "", icon: "⚽" },
  { id: "vintage", name: "Vintage", cls: "theme-vintage", icon: "📰" },
  { id: "neon", name: "Neon", cls: "theme-neon", icon: "✨" },
  { id: "arcade", name: "Arcade", cls: "theme-arcade", icon: "🕹️" }
];
let curThemeIdx = 0;
function applyTheme(idx) {
  curThemeIdx = (idx + THEMES.length) % THEMES.length;
  const th = THEMES[curThemeIdx];
  document.body.classList.remove("theme-vintage", "theme-neon", "theme-arcade");
  if (th.cls) document.body.classList.add(th.cls);
  try { localStorage.setItem("ali-di-rondine.theme", th.id); } catch (e) {}
}
function cycleTheme() {
  applyTheme(curThemeIdx + 1);
  const btn = $("#thBtn");
  if (btn) btn.textContent = "🎨 " + THEMES[curThemeIdx].name;
}
try {
  const savedTh = localStorage.getItem("ali-di-rondine.theme") || "classic";
  const fIdx = THEMES.findIndex(t => t.id === savedTh);
  applyTheme(fIdx >= 0 ? fIdx : 0);
} catch (e) {}

// ---- personaggi ----
const HERO = {
  leo:  { name: "Leo", ic: "⚽", hp: 70, sk: [
    { n: "Tiro", d: "danno 10-16", c: 0, f: (u, t) => hit(t, Math.round((rnd(10, 16) + G.lv * 2) * (u.pw ? 1.3 : 1)), `${u.name} calcia dritto in faccia a ${t.name}.`) },
    { n: "Tiro della Rondine", d: "danno 28-36 · grinta 3", c: 3, f: (u, t) => hit(t, Math.round((rnd(28, 36) + G.lv * 3) * (u.pw ? 1.3 : 1)), `TIRO DELLA RONDINE! ${t.name} guarda il pallone passare e non fa in tempo a offendersi.`) } ] },
  gigi: { name: "Gigi", ic: "🕊️", hp: 55, sk: [

    { n: "KRAAA!", d: "stordisce un nemico · grinta 2", c: 2, f: (u, t) => { t.stun = 1; floatText("STUN!", "#ffd23f"); return `${u.name} imita un gabbiano così bene che ${t.name} si gira a controllare. È fermo un turno.`; } } ] },
  sara: { name: "Sara", ic: "📓", hp: 55, sk: [

    { n: "Analisi", d: "il nemico prende +50% per 2 turni · grinta 2", c: 2, f: (u, t) => { t.mark = 2; floatText("ANALISI!", "#3fa7ff"); return `«Punto debole: tutto.» ${t.name} si sente osservato e peggiora.`; } } ] },

    { n: "Gatto Volante", d: "squadra riparata per un turno · grinta 2", c: 2, self: 1, f: (u) => { P.guard = 1; floatText("DIFESA!", "#3fa7ff"); return `GATTO VOLANTE! Nico si butta davanti a tutti. Il pavimento ci rimane male.`; } } ] },

    { n: "Focaccia al volo", d: "cura 35 il più ferito · grinta 2", c: 2, self: 1, f: (u) => { const w = P.u.filter(x => x.hp > 0).sort((a,b)=>a.hp-b.hp)[0]; if (w) { w.hp = Math.min(w.max, w.hp + 35); floatText("+35", "#57d68d"); return `Rita lancia una focaccia caldissima a ${w.name}: +35 HP!`; } return "Nessuno ferito."; } } ] },
};
const NAMES = { leo: "Leo", gigi: "Gigi", sara: "Sara", nico: "Nico", rita: "Rita" };

  cuoco: () => ({ name: "Pino Con Più Braccia", ic: "🍝", hp: 55, atk: [7, 11], say: ["«Otto frittelle alla volta, bello!»", "«Il menu è solo in latino!»"] }),

  ombra: () => ({ name: "Ombra del Provino", ic: "👤", hp: 70, atk: [9, 15], strike: 1, say: ["«Non ti prenderanno mai.»", "«Il provino era ieri.»", "«Chiudi gli occhi e arrenditi.»"] }),
  padella: () => ({ name: "Padella Furiosa", ic: "🍳", hp: 76, atk: [9, 14], say: ["«Brucia tutto sul fondo!»", "«Oggi non si mangia!»"] }),
  arbitro: () => ({ name: "L'Arbitro del Paradosso", ic: "⏱️", hp: 290, atk: [13, 19], boss: 1, heal: 0, say: ["«Fischio preventivo!»", "«Recupero infinito!»", "«Cartellino per presunzione!»"] }),
};

// ---- storia ----
const T = (who, text) => ({ who, text });
const STORY = {
  intro: [
    T(null, "Sera sul campetto del Borgo. L'allenamento è finito. Ugolino Lampadina è sul tetto del campanile con due cavi e un flipper."),
    T("ugolino", "Ho collegato il campanile al flipper per fare una luminaria «dinamica». È andata benissimo. Fino a quando è andata malissimo."),

    T(null, "Il campanile storto. In cima, al posto del flipper, c'è il Mister. Sorride. Troppo."),
    T("rugg", "Ragazzi! Che bello vedervi! Qui nessuno si arrabbia mai. Nessuno corre. Nessuno perde. Rimanete."),

    T("leo", "Mister, il Ruggeri vero urlava. Ma ci ha insegnato a giocare."),

    T("ugolino", "Ragazzi! Ho trovato l'interruttore! Se lo giro la crepa si chiude. Se lo lascio così, rimane aperta di un dito."),
  ],
  intro2: [
    T(null, "Capitolo 2: L'Orologio del Paradosso. La crepa sul campanile pulsa di una strana luce smeraldo."),
    T("ugolino", "Ragazzi! Il flipper fa le scintille e le lancette girano al contrario!"),
    T("leo", "Guardate la spiaggia... i granchi sventolano cartellini."),
    T("sara", "Dobbiamo raggiungere la cima dell'Orologio del Campanile per fermare il paradosso."),
    T("gigi", "Io ho la mia sciarpa portafortuna e molta fame. Andiamo.")
  ],
  n6: [
    T("gigi", "La spiaggia storta. I granchi hanno la divisa da arbitro."),
    T(null, "Due granchi giganti sventolano chele e cartellini gialli: «Fuorigioco preventivo!»")
  ],
  w6: [

  ],
  n9: [
    T(null, "La Pineta Capovolta. Gli alberi hanno le radici nel cielo viola. Tonino è lì con una cassa di Chinotto."),

const WHO = { rita: "Rita", ugolino: "Ugolino", papa: "Papà Moretti", tommy: "Tommy (perfetto)", tonino: "Tonino", rugg: "Mister Ruggeri", leo: "Leo", gigi: "Gigi", sara: "Sara", nico: "Nico", granchio: "Granchio", ombra: "Ombra", padella: "Padella", arbitro: "Arbitro" };

const NODES = [
  { id: "n1", t: "Il campetto storto", sub: "Due gabbiani sindacalizzati", foes: ["gabb", "gabb"], cap: 1 },
  { id: "n2", t: "Trattoria Moretti", sub: "Papà è famoso", foes: ["cuoco"], cap: 1 },

// ---- sprite pixel disegnati a codice (16x16), usati sia in mappa sia nei ritratti ----
const PAL = {
  leo:  { skin: "#f0c9a8", hair: "#4a2c1a", hs: "short", shirt: "#d33a3a", cap: "#2a4aa8", ballFoot: 1 },

const SPR = {};
// sprite 16x20 con contorno scuro e ombreggiatura; frame 0 fermo, 1/2 passo
function sprite(id, px, frame) {
  frame = frame || 0; const key = id + "@" + px + "#" + frame; if (SPR[key]) return SPR[key];

  <button id="a">Dì la verità: «Non sei felice, papà»<small>Leo si carica: colpi più forti nello scontro</small></button>
  <button id="b">Fai finta di niente e chiedi un autografo<small>Papà ti regala 2 focacce, ma Pino è più forte</small></button>`;
  $("#a").onclick = () => { G.flags.verita = 1; save(); dialog([T("leo", "Hai tutto, papà. Ma ti manca qualcuno che ti chiami a tavola. Lo so perché manca anche a me."), T("papa", "…Leo. Non dirlo ad alta voce. Poi lo so anch'io.")], () => fight(NODES[1])); };
  $("#b").onclick = () => { G.focacce += 2; G.flags.verita = 0; save(); dialog([T("papa", "Ecco, firmato sul piatto. Non lavarlo mai."), T("gigi", "Papà Moretti ha appena firmato un piatto come fosse un contratto.")], () => fight(NODES[1])); };
}
function rest() {
  app.innerHTML = vig(SCENE, "tonino") + `<div class="card"><span class="who">Tonino</span><br>Scegli bene. Il gelato non è una scelta neutra.</div>
  <button id="a">Assaggia il gusto Paradosso<small>La squadra guarisce del tutto. Ma si ricorderà di cose mai successe.</small></button>
  <button id="b" class="hot">Prendi due focacce e una granita<small>+2 focacce e il gruppo respira</small></button>`;
  $("#a").onclick = () => { G.flags.paradosso = 1; fin("n4", [T("tonino", "Stai benissimo. E ricordi che ieri hai segnato dall'altra parte del campo."), T("gigi", "Io mi ricordo un cane parlante. Era mio nonno.")]); };
  $("#b").onclick = () => { G.focacce += 2; fin("n4", [T("tonino", "Scelta noiosa e sana. Mi piaci."), T("sara", "Siamo qui da dieci minuti e questo è già il momento più normale.")]); };
}
function rest9() {
  app.innerHTML = vig(SCENE, "tonino") + `<div class="card"><span class="who">Tonino</span><br>Siamo sotto la Pineta Capovolta. Le radici nel cielo fanno ombra. Cosa prendete per rimettervi in forze?</div>
  <button id="a" class="hot">Bevi una bottiglietta di Chinotto del Paradosso<small>Ricarica tutta la Grinta della squadra al massimo (6/6)</small></button>
  <button id="b">Prendi 3 focacce calde di Rita<small>+3 focacce nell'inventario per curarsi</small></button>`;
  $("#a").onclick = () => { if (P) P.gr = 6; floatText("GRINTA MAX!", "#ffd23f"); fin("n9", [T("tonino", "Il Chinotto frizzante vi rimette le ali. Grinta piena!"), T("gigi", "Ha il sapore della vittoria e delle domeniche al mare.")]); };
  $("#b").onclick = () => { G.focacce += 3; floatText("+3 FOCACCE", "#57d68d"); fin("n9", [T("tonino", "Focaccia appena sfornata. Unte e perfette."), T("sara", "Siamo pronte per la cima dell'Orologio.")]); };
}
function fin(id, lines) { if (!G.done.includes(id)) G.done.push(id); save(); dialog(lines, map); }

// ---- scontri a turni con effetti visivi ----
let P, F, busy;
function floatText(txt, col = "#ff4d5a") {
  const el = document.createElement("div");
  el.className = "float-num";
  el.textContent = txt;
  el.style.color = col;
  el.style.left = (Math.random() * 30 + 35) + "%";
  el.style.top = (Math.random() * 25 + 35) + "%";
  app.appendChild(el);
  setTimeout(() => el.remove(), 800);
}
function triggerFlash() {
  app.classList.remove("screen-flash");
  void app.offsetWidth;
  app.classList.add("screen-flash");
}
const hit = (t, d, msg) => {
  if (t.shield && !t.mark && !t.stun) { d = Math.ceil(d / 4); msg += " Ma Tommy è perfetto: il colpo scivola via. Serve Sara, o un modo per farlo sbagliare."; }
  if (t.mark) d = Math.round(d * 1.5);
  t.hp = Math.max(0, t.hp - d);
  triggerFlash();
  floatText(`-${d}`, t.mark ? "#ffd23f" : "#ff4d5a");
  return `${msg} (-${d})`;
};
function fight(n) {
  const mk = (id) => { const h = HERO[id], mx = h.hp + (G.lv - 1) * 8; return { id, pal: id, name: h.name, ic: h.ic, hp: mx, max: mx, sk: h.sk }; };
  P = { u: G.party.map(mk), gr: 3, guard: 0, log: "Inizia lo scontro." };
  F = n.foes.map((k) => {
    const f = FOE[k]();
    f.pal = { gabb: 'gabb', cuoco: 'pino', tommy: 'tommy', rugg: 'rugg', granchio: 'granchio', ombra: 'ombra', padella: 'padella', arbitro: 'arbitro' }[k] || 'gabb';
    f.hp += (G.lv - 1) * 6; f.max = f.hp; return f;
  });
  if (n.id === 'n2' && G.flags.verita) P.u.forEach((u) => { if (u.id === 'leo') u.pw = 1; });
  if (n.id === 'n2' && G.flags.verita === 0) F.forEach((f) => { f.hp += 15; f.max += 15; });
  P.node = n; P.phase2 = false; busy = false; renderFight();
}
function renderFight() {
  const unit = (u, e) => `<div class="unit ${u.hp <= 0 ? "dead" : ""} ${u.stun ? "stun" : ""}"><b><img class="ui" src="${face(u.pal, 2)}" alt="">${esc(u.name)}</b> ${u.hp}/${u.max}<div class="bar ${e ? "e" : ""}"><i style="width:${Math.round((u.hp / u.max) * 100)}%"></i></div></div>`;
  app.innerHTML = vig(SCENE, null, F.map((f) => f.pal)) + `<div class="card"><div class="row"><div>${F.map((f) => unit(f, 1)).join("")}</div><div>${P.u.map((u) => unit(u)).join("")}</div></div>
  <div class="sub">Grinta ${"●".repeat(P.gr)}${"○".repeat(6 - P.gr)} · focacce ${G.focacce}</div><div class="log">${P.log}</div></div><div id="menu"></div>`;
  if (!busy) menu();
}
function menu() {
  P.u.forEach((x) => { if (x.hp > 0 && x.skip && !x.acted) { x.skip = 0; x.acted = true; P.log += ` ${esc(x.name)} è in sciopero.`; } });
  const u = P.u.find((x) => x.hp > 0 && !x.acted);
  if (!u) return foeTurn();
  const m = $("#menu");
  m.innerHTML = `<div class="sub">Tocca a ${esc(u.name)}</div>` + u.sk.map((s, i) => `<button data-s="${i}" ${P.gr < s.c ? "disabled" : ""}>${esc(s.n)}<small>${esc(s.d)}</small></button>`).join("") +
    `<button data-s="f" ${G.focacce < 1 ? "disabled" : ""}>Focaccia<small>cura 40 a ${esc(u.name)}</small></button><button data-s="p">Salta il turno<small>+1 grinta</small></button>` +
    `<button data-s="esc" style="background:#26121a;border-color:#e04838">🏠 Torna ad Ali di Rondine<small>Abbandona lo scontro e torna alla Home</small></button>`;
  m.querySelectorAll("button").forEach((b) => (b.onclick = () => {
    const s = b.dataset.s;
    if (s === "esc") {
      if (confirm("Vuoi abbandonare lo scontro e tornare al menu principale di Ali di Rondine?")) location.href = "./index.html";
      return;
    }
    if (s === "p") { P.gr = Math.min(6, P.gr + 1); end(u, `${u.name} respira e aspetta.`); }
    else if (s === "f") { G.focacce--; u.hp = Math.min(u.max, u.hp + 40); floatText("+40", "#57d68d"); end(u, `${u.name} mangia una focaccia. Si sente meglio e leggermente unto.`); }
    else { const sk = u.sk[+s]; if (sk.self) { P.gr -= sk.c; end(u, sk.f(u)); } else target(u, sk); }
  }));
}
function target(u, sk) {
  const alive = F.filter((f) => f.hp > 0);
  if (alive.length === 1) return run(u, sk, alive[0]);
  $("#menu").innerHTML = `<div class="sub">Contro chi?</div>` + alive.map((f, i) => `<button data-t="${i}">${f.ic} ${esc(f.name)} (${f.hp})</button>`).join("");
  $("#menu").querySelectorAll("button").forEach((b) => (b.onclick = () => run(u, sk, alive[+b.dataset.t])));
}
function run(u, sk, t) { P.gr -= sk.c; end(u, sk.f(u, t)); }
function end(u, msg) {
  u.acted = true; P.log = esc(msg);
  const boss = F.find((f) => f.boss);
  if (boss && !P.phase2 && boss.hp > 0 && boss.hp <= boss.max / 2) {
    P.phase2 = true; boss.heal = 12;
    P.log += `<br><i>${esc(boss.pal === "arbitro" ? STORY.mid2 : STORY.mid)}</i> Il boss carica la sua forma finale!`;
    boss.atk = [boss.atk[0] + 4, boss.atk[1] + 5];
  }
  if (F.every((f) => f.hp <= 0)) return win();
  renderFight();
}
function foeTurn() {
  busy = true; let log = P.log + "<br>";
  F.filter((f) => f.hp > 0).forEach((f) => {
    if (f.stun) { f.stun = 0; log += `${f.ic} ${esc(f.name)} è ancora stordito.<br>`; return; }
    const al = P.u.filter((u) => u.hp > 0); if (!al.length) return;
    const t = pick(al); let d = rnd(f.atk[0], f.atk[1]); if (f.weak) d = Math.ceil(d / 2); if (P.guard) d = Math.ceil(d / 3);
    t.hp = Math.max(0, t.hp - d);
    triggerFlash();
    floatText(`-${d}`, "#ff4d5a");
    log += `${esc(pick(f.say))} ${esc(f.name)} colpisce ${esc(t.name)} (-${d}).<br>`;
    if (f.strike && t.hp > 0 && Math.random() < 0.4) { t.skip = 1; log += `${esc(t.name)} viene coinvolto nello sciopero e salta il prossimo turno.<br>`; }
    if (f.weak) f.weak--; if (f.mark) f.mark--;
  });
  F.forEach((f) => { if (f.heal && f.hp > 0) { f.hp = Math.min(f.max, f.hp + f.heal); log += `${f.ic} ${esc(f.name)} recupera energie (+${f.heal}).<br>`; } });
  P.guard = 0; P.u.forEach((u) => (u.acted = false)); P.gr = Math.min(6, P.gr + 1); P.log = log;
  if (P.u.every((u) => u.hp <= 0)) return lose();
  busy = false; renderFight();
}
function lose() {
  app.innerHTML = `<div class="card"><span class="who">Narratore</span><br>Siete a terra. Una voce dice «Scusate, qui nessuno si fa male, per favore ricominciate». Il Borgo Storto vi rimette in piedi, con un po' di vergogna.</div><button class="hot" id="r">Riprova lo scontro</button><button id="m">Torna alla mappa</button>`;
  $("#r").onclick = () => fight(P.node); $("#m").onclick = map;
}
function win() {
  const n = P.node; G.lv++; G.focacce += n.boss ? 1 : 0;
  if (n.join && !G.party.includes(n.join)) G.party.push(n.join);
  if (!G.done.includes(n.id)) G.done.push(n.id); save();
  app.innerHTML = `<div class="card"><span class="who">Vittoria</span><br>Livello squadra ${G.lv}. ${n.join ? `${esc(NAMES[n.join])} si unisce alla squadra.` : ""}</div><button class="hot" id="c">Continua ▸</button>`;
  $("#c").onclick = () => {
    if (n.id === "n5") return dialog(STORY.win, choice);
    if (n.id === "n10") return dialog(STORY.win2, finale2);
    if (STORY["w" + n.id.slice(1)]) return dialog(STORY["w" + n.id.slice(1)], map);
    return map();
  };
}
function finale2() {
  app.innerHTML = `<div class="card"><span class="who">Vittoria del Capitolo 2</span><br>L'Orologio del Paradosso si è arrestato al novantesimo minuto. Le onde sono ridiscese verso il mare aperto, i granchi hanno riposto i cartellini e la grande crepa verde sopra il campanile si richiude con un dolce sibilo di vento.<br><br>Rita vi porge un ultimo trancio di focaccia: «Tornate a casa, ragazzi. Avete una partita da vincere al campetto vero».</div>
  <div class="card"><span class="who">Trofeo del Borgo Storto</span><br>Hai completato entrambi i Capitoli di Borgo Storto!</div>
  <button class="hot" id="t">◂ Torna al Titolo</button>`;
  $("#t").onclick = title;
}
function choice() {
  app.innerHTML = `<div class="card"><span class="who">Ugolino</span><br>Allora? Chiudo la crepa o la lascio aperta di un dito?</div>
  <button id="a">Chiudi la crepa<small>Tutto torna come prima. Quasi.</small></button>
  <button id="b" class="hot">Lasciala aperta di un dito<small>Il Borgo Storto resta raggiungibile per il Capitolo 2</small></button>`;
  $("#a").onclick = () => { G.flags.crepa = "chiusa"; save(); finale(); };
  $("#b").onclick = () => { G.flags.crepa = "aperta"; save(); finale(); };
}
function finale() {
  const aperta = G.flags.crepa !== "chiusa";
  app.innerHTML = `<div class="card"><span class="who">Fine del capitolo 1</span><br>${aperta ? "La crepa resta aperta di un dito. Dall'altra parte qualcosa ha sentito. Ugolino dice «È solo un gabbiano». Non è un gabbiano." : "La crepa si chiude con un rumore da sacchetto del pane. Il cielo torna a posto, ma dal campanile si sente ancora un piccolo «KRAAA». Gigi giura di non essere stato lui."}${G.flags.paradosso ? "<br><br><i>Qualcuno nel gruppo ricorda ancora il cane parlante. Sarà un problema.</i>" : ""}</div>
  <div class="card"><span class="who">Capitolo 2 Sbloccato</span><br>Puoi iniziare subito il Capitolo 2 con Rita e l'Arbitro del Paradosso!</div>
  <button class="hot" id="cap2">Vai al Capitolo 2 ▸</button>
  <button id="t">◂ Titolo</button>`;
  $("#cap2").onclick = () => { G.cap = 2; G.area = 5; save(); title(); };
  $("#t").onclick = title;
}
title();
if (/[?&]debug/.test(location.search)) window.__bs = { get G() { return G; }, get X() { return X; }, step, explore, MAPS };
})();
</script>
</body>
</html>
