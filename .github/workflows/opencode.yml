name: OpenCode Mobile Agent

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Analysis with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 -c '
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ.get("GEMINI_API_KEY")
          issue_title = os.environ.get("ISSUE_TITLE", "Analisi repository")
          issue_body = os.environ.get("ISSUE_BODY", "Analizza la struttura del progetto.")

          prompt = f"Agisci come un esperto sviluppatore di giochi e assistente di codice. L utente ha aperto una richiesta con questo titolo: \"{issue_title}\" e questa descrizione: \"{issue_body}\". Analizza la richiesta e genera il contenuto completo e dettagliato per un file markdown chiamato ANALYSIS.md che risponda esattamente a ciò che è stato chiesto, fornendo idee creative, suggerimenti tecnici e una suddivisione in micro-passi sicuri."

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          
          payload = {
              "contents": [{ "parts": [{ "text": prompt }] }]
          }
          
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})

          try:
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode("utf-8"))
                  text = res_data["candidates"][0]["content"]["parts"][0]["text"]
                  with open("ANALYSIS.md", "w", encoding="utf-8") as f:
                      f.write(text)
                  print("ANALYSIS.md generato con successo!")
          except urllib.error.HTTPError as e:
              print(f"Errore HTTP: {e.code} - {e.read().decode()}")
              exit(1)
          except Exception as e:
              print(f"Errore imprevisto: {e}")
              exit(1)
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add automated repository analysis"
          title: "Analisi automatica della repository (ANALYSIS.md)"
          body: "Questo file è stato generato automaticamente in risposta alla richiesta dell'issue."
          branch: "ai-analysis-patch"
          delete-branch: true
