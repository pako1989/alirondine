name: OpenCode Mobile Agent

on:
  issues:
    types: [opened, edited]

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenCode with Gemini
        uses: opencode-ai/opencode-action@main
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          
