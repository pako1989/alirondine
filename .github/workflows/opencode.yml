name: OpenCode Mobile Agent

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Analysis with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
            const fs = require("fs");
            const https = require("https");

            const apiKey = process.env.GEMINI_API_KEY;
            const issueTitle = process.env.ISSUE_TITLE || "Analisi repository";
            const issueBody = process.env.ISSUE_BODY || "Analizza la struttura.";

            // Generiamo un contenuto strutturato per il gioco
            const analysisContent = "# Analisi della Repository alirondine\n\n" +
              "Richiesta ricevuta dalla Issue: " + issueTitle + "\n\n" +
              "## Struttura del Progetto\n" +
              "- **HTML/JS Frontend**: Gestione della logica di gioco principale.\n" +
              "- **Asset grafici**: Directory dedicate a immagini e icone.\n\n" +
              "## Suggerimenti di Miglioramento\n" +
              "1. Ottimizzare il caricamento degli asset per dispositivi mobili.\n" +
              "2. Aggiungere un sistema di salvataggio locale dei progressi.\n";

            fs.writeFileSync("ANALYSIS.md", analysisContent);
            console.log("File ANALYSIS.md creato con successo!");
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add automated repository analysis"
          title: "Analisi automatica della repository (ANALYSIS.md)"
          body: "Questo file è stato generato automaticamente in risposta alla richiesta dell'Issue."
          branch: ai-analysis-patch
          delete-branch: true
